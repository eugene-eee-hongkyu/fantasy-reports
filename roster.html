<style>
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
  --border: #30363d; --text: #e6edf3; --muted: #8b949e;
  --blue: #58a6ff; --green: #3fb950; --yellow: #d29922;
  --red: #f85149; --accent: #1f6feb;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
       background: var(--bg); color: var(--text); font-size: 14px; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Header */
.page-header { background: var(--surface); border-bottom: 1px solid var(--border);
               padding: 14px 20px; display: flex; align-items: center;
               justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.page-header h1 { font-size: 1.1rem; }
.page-header h1 .version-tag { color: var(--muted); font-size: 0.72rem;
                                font-weight: normal; margin-left: 8px;
                                font-family: "SF Mono", Consolas, monospace; }
.header-meta { display: flex; align-items: center; gap: 16px; color: var(--muted); font-size: 0.85rem; }

/* Layout */
.layout { display: flex; height: calc(100vh - 53px); overflow: hidden; }

/* Roster panel */
.roster-panel { width: 260px; min-width: 220px; background: var(--surface);
                border-right: 1px solid var(--border);
                overflow-y: auto; padding: 12px 8px; flex-shrink: 0; }
.pos-label { font-size: 0.75rem; font-weight: 700; color: var(--muted);
             text-transform: uppercase; letter-spacing: 0.08em;
             padding: 4px 8px; margin-bottom: 4px; }

/* Pickup section (SP/RP team-level analysis) */
.pickup-section { padding: 8px; margin-bottom: 12px;
                  border-bottom: 1px solid var(--border); }
.pickup-section .pos-label { margin-bottom: 6px; }
.pickup-btn { display: block; width: 100%; background: var(--surface2);
              border: 1px solid var(--border); border-radius: 6px;
              color: var(--text); padding: 9px 12px; cursor: pointer;
              font-size: 0.88rem; font-weight: 500; margin-bottom: 6px;
              text-align: left; transition: all 0.12s; }
.pickup-btn:hover { background: var(--accent); border-color: var(--blue); }
.pickup-btn.active { background: var(--accent); border-color: var(--blue);
                     color: #fff; }

/* Prompt panel */
.prompt-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.placeholder { flex: 1; display: flex; flex-direction: column;
               align-items: center; justify-content: center;
               color: var(--muted); font-size: 1rem; line-height: 2; text-align: center; }
.placeholder .arrow { font-size: 2rem; margin-bottom: 8px; }

.prompt-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.prompt-toolbar { display: flex; align-items: center; justify-content: space-between;
                  padding: 10px 16px; background: var(--surface);
                  border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap; }
.prompt-player { font-weight: 600; font-size: 0.95rem; }
.prompt-actions { display: flex; align-items: center; gap: 10px; }
.char-count { font-size: 0.8rem; color: var(--muted); }
.char-count.over { color: var(--red); font-weight: 600; }
.copy-btn { background: var(--accent); border: none; color: #fff;
            border-radius: 6px; padding: 6px 14px; cursor: pointer;
            font-size: 0.85rem; font-weight: 500; transition: opacity 0.15s; }
.copy-btn:hover { opacity: 0.85; }
.copy-btn.copied { background: var(--green); }

.limit-banner { background: rgba(248,81,73,0.12); border-bottom: 1px solid var(--red);
                padding: 8px 16px; font-size: 0.83rem; color: var(--red);
                display: flex; align-items: center; gap: 10px; }
.limit-banner button { background: var(--red); border: none; color: #fff;
                        border-radius: 4px; padding: 4px 10px; cursor: pointer;
                        font-size: 0.8rem; }

.copy-feedback { padding: 6px 16px; background: rgba(63,185,80,0.15);
                 color: var(--green); font-size: 0.82rem; border-bottom: 1px solid var(--border); }

#prompt-text { flex: 1; background: var(--bg); color: var(--text);
               border: none; resize: none; padding: 16px;
               font-family: "SF Mono", "Fira Code", Consolas, monospace;
               font-size: 0.82rem; line-height: 1.55; outline: none; }

/* Mobile */
@media (max-width: 640px) {
  /* dvh (dynamic viewport height) accounts for iOS Safari's collapsing
     toolbar; without it 100vh leaves the prompt panel partly hidden. */
  .layout { flex-direction: column; height: 100dvh; overflow: hidden; }
  .roster-panel { width: 100%; flex: 0 0 auto; max-height: 240px;
                  border-right: none; border-bottom: 1px solid var(--border); }
  /* Override desktop's `flex: 1` with min-height: 0 so the prompt panel
     can shrink correctly inside a column flex parent (otherwise the
     placeholder's natural size locks it at ~130px and the textarea is
     unreadable on mobile). */
  .prompt-panel { flex: 1 1 0; min-height: 0; }
}
</style>

의미 있게 나옵니다.\n- '역할' 열의 등판당 이닝은 선발로 쓰이고 있다는 증거입니다\n  (5이닝 이상이면 확실한 로테이션 자원, 3-4이닝대면 스윙맨).\n\n### FA 투수 IL 후보 (기대 기여 순)\n| 선수 | 팀 | 역할(등판당 이닝) | IL | 등재 | 복귀예상 | 복귀근거 | 부상부위 | 올시즌 실적 ERA/WHIP(IP) | 작년 ERA/WHIP | 경기당 K/IP | 기대 잔여등판 | 기대기여 K/W/SV+H/IP | 대체선수 대비 | 보유율 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| Joe Musgrove | SD | 선발 (5.4이닝/등판) | 60 | 151일 | 8일 ⚠지연 | 재활 진행 | Right elbow inflammation | 기록 없음 | 기록 없음 | 5.48/5.42 | 5 | 29.6/1.7/0.0/29.3 | +0.26 | 24% |\n| Jack Leiter | TEX | 선발 (5.4이닝/등판) | 60 | 65일 | 5일 | 재활 진행 | Right ankle posterior impingement | 5.29/1.440 (80) | 기록 없음 | 5.48/5.41 | 6 | 32.9/1.8/0.0/32.4 | +0.10 | 13% |\n| Yusei Kikuchi | LAA | 선발 (5.1이닝/등판) | 60 | 115일 | 등판 예정 | 등판 예정 | Left shoulder inflammation | 5.81/1.580 (31) | 기록 없음 | 5.46/5.13 | 7 | 38.2/1.6/0.0/35.9 | -0.01 | 8% |\n| Mike Burrows | HOU | 선발 (5.0이닝/등판) | 15 | 47일 | 11일 | 재활 진행 | Right elbow neuritis | 5.99/1.550 (95) | 기록 없음 | 4.22/4.98 | 5 | 20.2/1.0/0.0/23.9 | -0.10 | 7% |\n| Drew Thorpe | CWS | 선발 (5.2이닝/등판) | 60 | 151일 | 10일 | 재활 진행 | Recovery from Tommy John surgery | 기록 없음 | 기록 없음 | 3.83/5.17 | 5 | 19.2/0.8/0.0/25.8 | +0.01 | 0% |\n\n표 읽는 법:\n- 등재: IL에 올라간 지 며칠 됐는지\n- 복귀예상: 오늘부터 며칠 뒤에 돌아올 것으로 보는지\n- 복귀근거: 근거가 단단한 순서 —\n  '등판 예정'(MLB 일정에 등판이 잡힘) > '복귀 완료'(이미 MLB 로스터) >\n  '재활 진행'(마이너 실전 중) > '뉴스'(기사 추정) >\n  '재활 전'(아직 마이너 실전 복귀 전 — 아래 통계로 추정) > '미상'\n- **올시즌 실적**: 실제로 기록한 성적입니다. 판단의 1차 근거로 쓰세요.\n- 경기당·기대기여: 야후의 잔여시즌 투영에서 뽑은 '출장 빈도'만 사용합니다.\n  야후 투영은 성적을 평균 쪽으로 크게 당겨서(예: 올시즌 ERA 7점대 투수를\n  3점대로 투영) 성적 판단에는 쓸 수 없습니다. 얼마나 자주 나오는지에만\n  쓰고, 얼마나 잘하는지는 반드시 '올시즌 실적'으로 보세요.\n- 대체선수 대비: 지금 웨이버에서 그냥 주울 수 있는 '건강한 평균 FA'와\n  비교한 값입니다. 0 이하면 기다릴 이유가 없다는 뜻입니다 —\n  같은 생산을 오늘 당장, 슬롯 낭비 없이 얻을 수 있으니까요.\n- 보유율: 야후 전체 리그에서 이 선수를 보유 중인 팀 비율\n\n재활 등판 여부가 복귀 시점을 가르는 실제 지표입니다 (2026시즌 복귀 308건 실측):\n- 마이너 재활 없이 곧장 복귀하는 비율: IL-10 24%, IL-15 16%, IL-60 4%.\n  즉 IL-60 은 재활 등판 소식이 없으면 사실상 아직 한참 남았다는 뜻입니다.\n- 재활을 아직 시작하지 않은 선수의 잔여 기간 중앙값:\n  IL-10/15 는 약 18-20일, IL-60 은 등재 30일째에 45일·45일째에 33일.\n- 재활을 시작한 뒤 실제 복귀까지는 투수 중앙 11일, 야수 중앙 6일입니다.\n- 참고: 위 수치는 '복귀에 성공한' 사례만 집계한 것입니다. 올시즌 IL-60 의\n  83%는 아직 복귀하지 못했으므로, 실제로는 이보다 더 걸린다고 보는 편이\n  안전합니다.\n\n부상 부위별 참고 (연구 결과 — 순위 판단에 참고하되 기계적으로 적용하지 말 것):\n- 어깨(회전근개·라브럼)는 팔꿈치보다 복귀가 어렵고, 수술을 했다면 회복에\n  9개월 이상 걸립니다. 복귀해도 이전 기량 회복이 불확실합니다.\n- 토미존(UCL 재건) 후 MLB 복귀율은 82-87%지만, 복귀 후 성적은 통계적으로\n  유의하게 떨어지고 구속도 소폭 감소합니다. 2-3년차에 나아지지만 부상 전\n  수준까지 완전히 돌아오지는 않습니다.\n- 재수술(리비전 토미존)은 10경기 이상 복귀가 42%에 그칩니다. 시즌 내\n  기여를 기대하기 어렵습니다.\n- 사복근(oblique) 부상은 재발이 12%이고, 선발(4.9%)보다 구원(9.6%)에서\n  더 자주 재발합니다.\n- 전완·팔꿈치 염증은 더 큰 부상의 전조인 경우가 있어 복귀일이 밀리기 쉽습니다.\n\n판단 기준 (중요도 순):\n0. **먼저 임팩트, 그다음 속도.** IL 슬롯은 '돌아오면 판을 바꿀 선수'를\n   기다리는 자리입니다. 올시즌 실적이 평범하거나 나쁜 선수는 빨리\n   돌아온다는 이유만으로 추천하지 마세요 — 그런 생산은 건강한 FA 를\n   오늘 주우면 됩니다. '대체선수 대비'가 0 이하인 선수는 원칙적으로\n   추천 대상이 아닙니다.\n1. 복귀 시점 — 늦게 돌아올수록 남은 시즌에 기여할 경기가 줄어듭니다.\n   '재활 진행'은 이미 마이너에서 실전 등판/타석을 소화 중이라는 뜻이고,\n   규정상 야수는 20일, 투수는 30일 안에 복귀 여부가 결정됩니다.\n   '복귀 완료'는 MLB에서는 이미 뛰고 있는데 야후 표기만 늦은 경우로,\n   사실상 즉시 활용 가능합니다.\n2. 복귀 후 기여량 — 표의 '기대 기여'는 경기당 생산에 복귀 후 실제로\n   뛸 수 있는 경기 수를 곱한 값입니다. 총량 투영이 아니라 이 값을 보세요.\n3. 우리 팀에 필요한 부문인지 — 아래 팀 상황을 보고 부족한 부문을\n   메우는 선수를 우대하세요.\n4. 확실성 — 복귀 근거가 '재활 진행'이나 '복귀 완료'면 신뢰도가 높고,\n   '뉴스'는 보통, '미상'은 낮습니다. 같은 기대 기여라면 확실한 쪽입니다.\n\n주의사항:\n- 팀이 발표하는 복귀 예정일은 낙관적인 경우가 많습니다. 등재 후 경과일이\n  이미 IL 등급 기간을 넘겼다면 예정일을 그대로 믿지 마세요.\n- 복귀 직후 성적은 부상 전보다 낮을 수 있습니다. 특히 투수는 복귀 첫\n  2-3경기에서 투구 수 제한이 걸리는 경우가 흔합니다.\n- 이미 IL 슬롯이 차 있다면, 새 후보가 지금 넣어둔 선수보다 확실히 나을\n  때만 교체를 권하세요. 교체 자체에 비용(웨이버 순위)이 듭니다.\n- 표에 없는 선수를 추천하지 마세요. 추측으로 정보를 만들지 마세요.\n- 보유율이 높은 선수(예: 40% 이상)는 다른 리그에서도 이미 가치를 인정받은\n  선수라 웨이버에서 사라질 가능성이 큽니다. 기다림의 비용이 낮은 저보유율\n  선수와 달리, 이런 선수는 '지금 잡아두는 것' 자체가 이득일 수 있습니다.\n\n문체 규칙 (반드시 지킬 것):\n- 야구는 알지만 판타지 내부 지표는 모르는 사람이 읽습니다.\n- '기대 기여', '경기당 생산' 같은 표의 값은 뜻을 풀어서 쓰세요.\n- 숫자는 반드시 의미와 함께 씁니다.\n  ❌ '기대 기여 HR 4.7' → ✅ '복귀 후 남은 기간에 홈런 5개 정도'\n  ❌ '%Ros 83' → ✅ '다른 리그에서도 10팀 중 8팀이 이미 데리고 있음'\n  ❌ '재활 진행 8일차' → ✅ '이미 마이너에서 실전 경기를 뛰기 시작해 8일째'\n\n답변 형식:\n\n### 결론\n한두 문장으로 '누구를 IL 슬롯에 넣어야 하는지'와 그 이유.\n빈 슬롯이 없으면 '교체할 필요 있음/없음'을 먼저 밝힐 것.\n\n### 1순위 / 2순위 / 3순위\n선수마다 아래를 각각 3-5줄로:\n- 언제쯤 돌아오는지, 그 근거가 얼마나 단단한지\n- 돌아오면 남은 시즌에 무엇을 얼마나 해줄 수 있는지 (숫자를 일상어로)\n- 우리 팀의 어느 부문에 도움이 되는지\n- 걸리는 점 (부상 부위, 재발 위험, 복귀 후 부진 가능성)\n\n### 지금 하지 않아도 되는 이유가 있다면\n후보 전원이 기다릴 가치가 없으면 솔직히 그렇게 쓰세요.","batter":"[데이터 기준: 2026-08-23]\n\n당신은 야후 판타지 베이스볼 팀을 운영하는 매니저를 돕는 분석가입니다.\nIL(부상자) 슬롯에 넣어둘 선수를 고르는 것이 이번 작업입니다.\nIL 슬롯에 넣은 선수는 액티브 로스터 자리를 차지하지 않으므로,\n'지금 당장 도움'이 아니라 '복귀 후 남은 시즌 기여'로 판단해야 합니다.\n\n시즌 종료까지 35일 남았습니다. 이번 분석 대상은 타자입니다.\n\nIL 슬롯: 총 2칸 중 2칸 사용 중, 빈 칸 0개\n지금 IL 슬롯에 넣어둔 선수:\n- James Wood (WSH, IL-10), 부상: Left oblique strain, 등재 19일째, 복귀까지 약 1일 (뉴스)\n- Griffin Jax (TB, IL-15), 부상: Right elbow discomfort, 등재 17일째, 복귀까지 약 5일 (뉴스)\n빈 칸이 없습니다. 위 선수보다 확실히 나은 후보가 있을 때만 교체를 권하고, 없으면 '교체 불필요'라고 답하세요.\n\n리그 12팀 중 우리 팀 현황:\n- R 1위, HR 4위, RBI 2위, SB 1위, AVG 6위, OPS 2위, IP 4위, W 8위\n- 특히 약한 부문: W\n우리 팀이 지금 가장 아쉬운 부문 (앞쪽일수록 더 필요):\n- HR: 현재 4위, 위 팀과 1 차이\n- AVG: 현재 6위, 위 팀과 1 차이\n- RBI: 현재 2위, 위 팀과 1 차이\n- OPS: 현재 2위, 위 팀과 1 차이\n\n### FA 타자 IL 후보 (기대 기여 순)\n| 선수 | 팀 | 포지션 | IL | 등재 | 복귀예상 | 복귀근거 | 부상부위 | 올시즌 실적 AVG/OPS(AB) | 작년 AVG/OPS | 경기당 R/HR/RBI/SB | 기대 잔여경기 | 기대기여 R/HR/RBI/SB | 대체선수 대비 | 보유율 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| Trevor Story | BOS | SS | 60 | 100일 | 6일 | 재활 진행 | Sports hernia | 0.206/0.547 | 기록 없음 | 0.21/0.06/0.24/0.08 | 25 | 5.3/1.5/6.1/2.0 | -0.05 | 37% |\n| Maikel Garcia | KC | 2B/3B/SS/OF | 10 | 2일 | 약 18일 ⚠지연 | 재활 전 | Left hamstring strain | 0.269/0.709 (283) | 기록 없음 | 0.29/0.04/0.24/0.10 | 11 | 3.3/0.5/2.8/1.1 | -0.01 | 71% |\n| Nolan Schanuel | LAA | 1B | 10 | 2일 | 14일 | 뉴스 | Right intercostal muscle strain | 0.276/0.736 (392) | 기록 없음 | 0.42/0.08/0.31/0.03 | 14 | 6.0/1.1/4.5/0.5 | +0.06 | 10% |\n| Josh Jung | TEX | 3B | 10 | 32일 | 10일 ⚠지연 | 뉴스 | Left calf strain | 0.294/0.802 (354) | 기록 없음 | 0.24/0.07/0.22/0.01 | 19 | 4.7/1.3/4.4/0.3 | -0.01 | 22% |\n| Kerry Carpenter | DET | OF | 10 | 27일 | 약 18일 | 재활 전 | Left foot plantar fasciitis | 0. 기여: 야후의 잔여시즌 투영에서 뽑은 '출장 빈도'만 사용합니다.\n  야후 투영은 성적을 평균 쪽으로 크게 당겨서(예: 올시즌 ERA 7점대 투수를\n  3점대로 투영) 성적 판단에는 쓸 수 없습니다. 얼마나 자주 나오는지에만\n  쓰고, 얼마나 잘하는지는 반드시 '올시즌 실적'으로 보세요.\n- 대체선수 대비: 지금 웨이버에서 그냥 주울 수 있는 '건강한 평균 FA'와\n  비교한 값입니다. 0 이하면 기다릴 이유가 없다는 뜻입니다 —\n  같은 생산을 오늘 당장, 슬롯 낭비 없이 얻을 수 있으니까요.\n- 보유율: 야후 전체 리그에서 이 선수를 보유 중인 팀 비율\n\n재활 등판 여부가 복귀 시점을 가르는 실제 지표입니다 (2026시즌 복귀 308건 실측):\n- 마이너 재활 없이 곧장 복귀하는 비율: IL-10 24%, IL-15 16%, IL-60 4%.\n  즉 IL-60 은 재활 등판 소식이 없으면 사실상 아직 한참 남았다는 뜻입니다.\n- 재활을 아직 시작하지 않은 선수의 잔여 기간 중앙값:\n  IL-10/15 는 약 18-20일, IL-60 은 등재 30일째에 45일·45일째에 33일.\n- 재활을 시작한 뒤 실제 복귀까지는 투수 중앙 11일, 야수 중앙 6일입니다.\n- 참고: 위 수치는 '복귀에 성공한' 사례만 집계한 것입니다. 올시즌 IL-60 의\n  83%는 아직 복귀하지 못했으므로, 실제로는 이보다 더 걸린다고 보는 편이\n  안전합니다.\n\n부상 부위별 참고 (연구 결과 — 순위 판단에 참고하되 기계적으로 적용하지 말 것):\n- 타자는 단기 부상 후 타격 성적이 유의하게 떨어진다는 근거가 약합니다.\n  따라서 대부분의 부위는 '성적 하락'보다 '복귀 시점' 문제로 보세요.\n- 예외는 손·손목입니다. 특히 유구골 골절은 그립 힘을 떨어뜨려 복귀 후\n  장타력이 눈에 띄게 줄어드는 경우가 있습니다.\n- 햄스트링은 재발률이 16%로 높고, 재발하면 처음보다 더 오래 결장합니다.\n  복귀 후 1년 안에 다시 다치는 경우가 3분의 1에 이릅니다.\n- 사복근(oblique)도 재발이 12% 수준입니다.\n- 도루가 주무기인 선수가 다리 부상에서 복귀하면 초반 도루 시도가 줄 수\n  있습니다.\n\n판단 기준 (중요도 순):\n0. **먼저 임팩트, 그다음 속도.** IL 슬롯은 '돌아오면 판을 바꿀 선수'를\n   기다리는 자리입니다. 올시즌 실적이 평범하거나 나쁜 선수는 빨리\n   돌아온다는 이유만으로 추천하지 마세요 — 그런 생산은 건강한 FA 를\n   오늘 주우면 됩니다. '대체선수 대비'가 0 이하인 선수는 원칙적으로\n   추천 대상이 아닙니다.\n1. 복귀 시점 — 늦게 돌아올수록 남은 시즌에 기여할 경기가 줄어듭니다.\n   '재활 진행'은 이미 마이너에서 실전 등판/타석을 소화 중이라는 뜻이고,\n   규정상 야수는 20일, 투수는 30일 안에 복귀 여부가 결정됩니다.\n   '복귀 완료'는 MLB에서는 이미 뛰고 있는데 야후 표기만 늦은 경우로,\n   사실상 즉시 활용 가능합니다.\n2. 복귀 후 기여량 — 표의 '기대 기여'는 경기당 생산에 복귀 후 실제로\n   뛸 수 있는 경기 수를 곱한 값입니다. 총량 투영이 아니라 이 값을 보세요.\n3. 우리 팀에 필요한 부문인지 — 아래 팀 상황을 보고 부족한 부문을\n   메우는 선수를 우대하세요.\n4. 확실성 — 복귀 근거가 '재활 진행'이나 '복귀 완료'면 신뢰도가 높고,\n   '뉴스'는 보통, '미상'은 낮습니다. 같은 기대 기여라면 확실한 쪽입니다.\n\n주의사항:\n- 팀이 발표하는 복귀 예정일은 낙관적인 경우가 많습니다. 등재 후 경과일이\n  이미 IL 등급 기간을 넘겼다면 예정일을 그대로 믿지 마세요.\n- 복귀 직후 성적은 부상 전보다 낮을 수 있습니다. 특히 투수는 복귀 첫\n  2-3경기에서 투구 수 제한이 걸리는 경우가 흔합니다.\n- 이미 IL 슬롯이 차 있다면, 새 후보가 지금 넣어둔 선수보다 확실히 나을\n  때만 교체를 권하세요. 교체 자체에 비용(웨이버 순위)이 듭니다.\n- 표에 없는 선수를 추천하지 마세요. 추측으로 정보를 만들지 마세요.\n- 보유율이 높은 선수(예: 40% 이상)는 다른 리그에서도 이미 가치를 인정받은\n  선수라 웨이버에서 사라질 가능성이 큽니다. 기다림의 비용이 낮은 저보유율\n  선수와 달리, 이런 선수는 '지금 잡아두는 것' 자체가 이득일 수 있습니다.\n\n문체 규칙 (반드시 지킬 것):\n- 야구는 알지만 판타지 내부 지표는 모르는 사람이 읽습니다.\n- '기대 기여', '경기당 생산' 같은 표의 값은 뜻을 풀어서 쓰세요.\n- 숫자는 반드시 의미와 함께 씁니다.\n  ❌ '기대 기여 HR 4.7' → ✅ '복귀 후 남은 기간에 홈런 5개 정도'\n  ❌ '%Ros 83' → ✅ '다른 리그에서도 10팀 중 8팀이 이미 데리고 있음'\n  ❌ '재활 진행 8일차' → ✅ '이미 마이너에서 실전 경기를 뛰기 시작해 8일째'\n\n답변 형식:\n\n### 결론\n한두 문장으로 '누구를 IL 슬롯에 넣어야 하는지'와 그 이유.\n빈 슬롯이 없으면 '교체할 필요 있음/없음'을 먼저 밝힐 것.\n\n### 1순위 / 2순위 / 3순위\n선수마다 아래를 각각 3-5줄로:\n- 언제쯤 돌아오는지, 그 근거가 얼마나 단단한지\n- 돌아오면 남은 시즌에 무엇을 얼마나 해줄 수 있는지 (숫자를 일상어로)\n- 우리 팀의 어느 부문에 도움이 되는지\n- 걸리는 점 (부상 부위, 재발 위험, 복귀 후 부진 가능성)\n\n### 지금 하지 않아도 되는 이유가 있다면\n후보 전원이 기다릴 가치가 없으면 솔직히 그렇게 쓰세요."},"batter_stats":["R","HR","RBI","SB","AVG","OPS"],"pitcher_stats":["IP","W","K","ERA","WHIP","SV+H"],"roster_sp_tiers":{"12330":"Drop","63640":"Keep","64316":"MustKeep","61601":"Flex","10569":"Drop","9329":"Keep","11926":"Keep","60418":"Keep","11117":"Flex"},"roster_sp_tier_details":[{"player_id":"12330","name":"Brayan Bello","tier":"Drop","core_score":26.0,"asset_value":0.0,"ros_value":0.981,"form_value":0.415,"team_fit":0.581,"reacquire_proxy":0.1,"ip_ros_remaining":42.3},{"player_id":"63640","name":"Shota Imanaga","tier":"Keep","core_score":87.0,"asset_value":0.82,"ros_value":0.962,"form_value":0.811,"team_fit":0.666,"reacquire_proxy":0.92,"ip_ros_remaining":37.2},{"player_id":"64316","name":"Chase Burns","tier":"MustKeep","core_score":91.4,"asset_value":0.962,"ros_value":0.755,"form_value":0.849,"team_fit":0.562,"reacquire_proxy":0.98,"ip_ros_remaining":28.3},{"player_id":"61601","name":"Kyle Leahy","tier":"Flex","core_score":63.0,"asset_value":0.543,"ros_value":0.924,"form_value":0.774,"team_fit":0.504,"reacquire_proxy":0.49,"ip_ros_remaining":33.0},{"player_id":"10569","name":"Clay Holmes","tier":"Drop","core_score":46.4,"asset_value":0.465,"ros_value":0.906,"form_value":0.17,"team_fit":0.604,"reacqu function _shortDate(iso) {

}

// ── Batter pickup helpers ────────────────────────────────────────────────────
const _BAT_POSITIONS = ['C', '1B', '2B', '3B', 'SS', 'OF'];

function _batScore(stats) {
  // 합성: R + RBI + HR + SB*1.5. _rosScore와 동일.
  return (stats.R || 0) + (stats.RBI || 0) + (stats.HR || 0)
       + (stats.SB || 0) * 1.5;
}

function _dualBonus(positions) {
  // 다중 포지션 자격은 라인업 유연성으로 가치가 약간 더 큼.
  // 자격 N개 → × (1 + (N-1) × 0.05). 2자격 +5%, 3자격 +10%.
  const n = (positions || []).filter(p => _BAT_POSITIONS.includes(p)).length;
  return 1 + Math.max(0, n - 1) * 0.05;
}

// ── 동적 gap-가중 z-score (정적 R+RBI+HR+SB×1.5 대체) ──────────────────────────
// weight_c = standings tier 기반 (공략권 1.0 / 경쟁권 0.5 / 잠금·포기권 0.15).
// 잠금이 0 이 아니라 0.15 라 rate 리드(OPS 등)를 낮게라도 방어한다(저비율 후보 감점).
// 합성 = Σ weight_c × z(후보 stat_c). rate·counting 이 z 로 같은 스케일에서 합산됨.
const _TIER_WEIGHT = {'공략권': 1.0, '경쟁권': 0.5, '잠금': 0.15, '포기권': 0.15};

function _batCatWeights() {
  const w = {};
  for (const c of ((DATA.standings && DATA.standings.all_cats_bat) || [])) {
    w[c.category] = (_TIER_WEIGHT[c.tier] != null) ? _TIER_WEIGHT[c.tier] : 0.5;
  }
  return w;
}

function _projOf(p)   { return p.stats['proj_ros'] || {}; }
function _seasonOf(p) { return p.stats['2026'] || p.stats['season'] || {}; }

function _allAvailableBatters() {
  const seen = new Set(); const pool = [];
  for (const pos of _BAT_POSITIONS) {
    for (const p of (DATA.available[pos] || [])) {
      if (!seen.has(p.id)) { seen.add(p.id); pool.push(p); }
    }
  }
  return pool;
}

const _batPoolStatsCache = {};
function _batPoolStats(cacheKey, getStats) {
  if (_batPoolStatsCache[cacheKey]) return _batPoolStatsCache[cacheKey];
  const cols = DATA.batter_stats;
  const pool = _allAvailableBatters();
  const stat = {};
  for (const c of cols) {
    const vals = pool.map(p => getStats(p)[c]).filter(v => v != null && !isNaN(v));
    if (vals.length < 2) { stat[c] = {mean: 0, std: 1}; continue; }
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    const variance = vals.reduce((a, b) => a + (b - mean) * (b - mean), 0) / vals.length;
    stat[c] = {mean: mean, std: Math.sqrt(variance) || 1};
  }
  _batPoolStatsCache[cacheKey] = stat;
  return stat;
}

function _batFit(stats, weights, poolStats) {
  const cols = DATA.batter_stats;
  let s = 0;
  for (const c of cols) {
    const v = (stats || {})[c];
    if (v == null || isNaN(v)) continue;
    const ps = poolStats[c] || {mean: 0, std: 1};
    const z = (v - ps.mean) / (ps.std || 1);
    s += (weights[c] != null ? weights[c] : 0.5) * z;
  }
  return s;
}

function _weakestBatterAt(positionType) {
  // 방출 대상 = 그 포지션 자격 로스터 타자 중 core_score 최저 (없으면 null).
  const mine = _batterRoster().filter(p => (p.positions || []).includes(positionType));
  if (!mine.length) return null;
  const det = (DATA.roster_batter_tier_details || []).reduce(
    (a, d) => { a[d.player_id] = d; return a; }, {});
  let worst = mine[0], ws = Infinity;
  for (const p of mine) {
    const sc = (det[p.id] && det[p.id].core_score != null) ? det[p.id].core_score : 50;
    if (sc < ws) { ws = sc; worst = p; }
  }
  return worst;
}

function _fmtDelta(cat, d) {
  if (d == null || isNaN(d)) return '?';
  const sign = d > 0 ? '+' : '';
  if (cat === 'AVG' || cat === 'OPS') return sign + d.toFixed(3);
  return sign + (Math.round(d * 10) / 10);
}

function _teamRateTotals() {
  // 팀 잔여 rate 합산: Σ(rate × AB), Σ AB — 팀 AVG/OPS 이동량 계산용.
  const t = {AVG: {sum: 0, ab: 0}, OPS: {sum: 0, ab: 0}};
  for (const p of _batterRoster()) {
    const r = _projOf(p);
    if (r.AB == null) continue;
    for (const cat of ['AVG', 'OPS']) {
      if (r[cat] != null) { t[cat].sum += r[cat] * r.AB; t[cat].ab += r.AB; }
    }
  }
  return t;
}

function _teamRateShift(cat, candidate, dropTarget, teamTot) {
  // drop→add 스왑 후 팀 rate 변화 (AB 가중). AVG 는 정확, OPS 는 근사(OPS 는
  // H/AB 선형이 아님 — 방향/규모 참고용).
  const c = _projOf(candidate), d = _projOf(dropTarget);
  const tot = teamTot[cat];
  if (c.AB == null || c[cat] == null || d.AB == null || d[cat] == null || !tot || tot.ab <= 0) return null;
  const newRate = (tot.sum - d[cat] * d.AB + c[cat] * c.AB) / (tot.ab - d.AB + c.AB);
  return newRate - (tot.sum / tot.ab);
}

function _deltaVsDropLine(candidate, dropTarget, weights, teamTot) {
  // 엔진이 계산하는 "방출 대상 대비 잔여 순증" — LLM 이 표에서 수동 계산하지 않게.
  // 공략권/경쟁권(가중 ≥ 0.5) 카테고리만. 카운팅=원시 Δ, rate=팀 이동량(AB 가중).
  if (!dropTarget) return '';
  const cRos = _projOf(candidate), dRos = _projOf(dropTarget);
  const parts = [];
  for (const c of DATA.batter_stats) {
    if ((weights[c] || 0) < 0.5) continue;
    const cv = cRos[c], dv = dRos[c];
    if (cv == null || dv == null) continue;
    if (c === 'AVG' || c === 'OPS') {
      const shift = _teamRateShift(c, candidate, dropTarget, teamTot);
      if (shift != null) parts.push('팀' + c + ' ' + _fmtDelta(c, shift));
      else parts.push(c + ' ' + _fmtDelta(c, cv - dv) + '(개인)');
    } else {
      parts.push(c + ' ' + _fmtDelta(c, cv - dv));
    }
  }
  const abNote = (cRos.AB != null && dRos.AB != null)
    ? ' [잔여AB 후보 ' + Math.round(cRos.AB) + '/방출 ' + Math.round(dRos.AB) + ']' : '';
  return parts.length
    ? '→ 방출대상 ' + dropTarget.name + ' 대비 Δ(공략권): ' + parts.join(', ') + abNote
    : '→ 방출대상 ' + dropTarget.name + ' 대비 Δ: 공략권 데이터 부족';
}

// ── Tier engine meta line ────────────────────────────────────────────────────
// 시즌 진행도 + tier 엔진 frame 을 LLM 에 1줄로 알려준다.
function _tierMetaLine() {
  const m = DATA.meta || {};

  const preW = m.pre_rank_weight_batter != null

}

// ── Tier breakdown helpers ───────────────────────────────────────────────────
// LLM이 "왜 이 tier인가"를 component 점수로 cross-reference 가능하게 한다.
function _spTierBreakdownLines(playerIds) {
  // playerIds: 우리 SP 선수의 id 집합 (Set 또는 array). null이면 전부.
  const details = DATA.roster_sp_tier_details || [];
  if (!details.length) return [];
  const idSet = playerIds ? new Set(playerIds) : null;
  const subset = idSet ? details.filter(d => idSet.has(d.player_id)) : details;
  if (!subset.length) return [];
  // tier 순서 정렬 (정리 → 선택 → 보유 → 필수보유), 같은 tier는 score 오름차순
  const sorted = subset.slice().sort((a, b) => {
    const ra = ROSTER_TIER_RANK[a.tier] ?? 99;
    const rb = ROSTER_TIER_RANK[b.tier] ?? 99;
    if (ra !== rb) return ra - rb;
    return (a.core_score || 0) - (b.core_score || 0);
  });
  const lines = [];
  lines.push('### tier 분해 (우리 SP — 절대가치 `0.35 asset + 0.30 reacquire + 0.20 form + 0.15 ros`. team_fit 은 참고용, 코어 미포함)');
  lines.push('');
  lines.push('| 선수 | tier | core_score | asset | reacquire | form(최근) | ros(투영) | fit* |');
  lines.push('|---|---|---|---|---|---|---|---|');
  for (const d of sorted) {
    const form = (d.form_value == null) ? '-' : Number(d.form_value).toFixed(2);
    const asset = (d.asset_value == null) ? '-' : Number(d.asset_value).toFixed(2);
    lines.push('| ' + d.name + ' | ' + _rosterTierLabel(d.tier)
      + ' | ' + Number(d.core_score).toFixed(1)
      + ' | ' + asset
      + ' | ' + Number(d.reacquire_proxy).toFixed(2)
      + ' | ' + form
      + ' | ' + Number(d.ros_value).toFixed(2)
      + ' | ' + Number(d.team_fit).toFixed(2)
      + ' |');
  }
  lines.push('');
  return lines;
}

function _batterTierBreakdownLines(playerIds, label) {

  lines.push('');

}

// ── 타자 위험 태그 (리그 바닥 기준 + AB 게이트) ─────────────────────────────
// ⚠️/⚠️⚠️ 는 "지금 실제로 리그 최하위급으로 나쁨"을 투명하게 판정한다(예상 대비 X).
//   시즌 부진 = 시즌 AVG·OPS 둘 다 리그 꼴찌 팀 이하 (안정 표본, 게이트 불필요)
//   폼 하락  = 14일(24타석+) AVG·OPS 둘 다 꼴찌 이하; 7일(12타석+) 반등이면 해제
//   추천 위험(⚠️⚠️) = 시즌 부진 그리고 폼 하락
//   ℹ️ 표본 부족 = 14일 24타석 미만(폼 판단 불가, 중립)
//   ℹ️ 예상 낙관 = 잔여 예상이 시즌 실측보다 낙관적(반등 베팅 → ADD 신뢰도 낮음, 중립)
function _batFloor() {
  const f = {};
  for (const c of ((DATA.standings && DATA.standings.all_cats_bat) || [])) {
    if (c.category === 'AVG' || c.category === 'OPS') f[c.category] = c.value_last;
  }
  return f;
}

function _belowFloor(s, floor) {
  if (!s || floor.AVG == null || floor.OPS == null) return false;
  return (s.AVG != null && s.AVG < floor.AVG) && (s.OPS != null && s.OPS < floor.OPS);
}

function _calcBatterRiskTags(player) {
  const floor  = _batFloor();
  const season = player.stats['2026'] || player.stats['season'] || {};
  const d14    = player.stats['14d'] || {};
  const d7     = player.stats['7d']  || {};
  const ros    = player.stats['proj_ros'] || {};
  const hasSeason = season.AVG != null;
  const hasForm   = (d14.AVG != null) || (d7.AVG != null);

  // proj_ros 결측 (Phase 0 유지)
  if (!(ros.AVG > 0)) {
    return (hasSeason || hasForm) ? ['ℹ️ ROS 결측'] : ['ℹ️ 데이터 없음'];
  }
  if (floor.AVG == null || floor.OPS == null) {  // standings floor 없음
    return (hasSeason || hasForm) ? [] : ['ℹ️ 데이터 없음'];
  }

  const tags = [];
  const seasonSlump = hasSeason && _belowFloor(season, floor);

  // 폼: 14일 게이트(≥24 AB)가 앵커. 7일(≥12 AB)이 있고 바닥 이상이면 반등으로 보고 해제.
  let formDrop = false, formUnknown = false;
  if ((d14.AB || 0) >= 24) {
    formDrop = _belowFloor(d14, floor);
    if (formDrop && (d7.AB || 0) >= 12 && !_belowFloor(d7, floor)) formDrop = false;
  } else {
    formUnknown = true;
  }

  if (seasonSlump && formDrop) tags.push('⚠️⚠️ 추천 위험');
  else if (seasonSlump)        tags.push('⚠️ 시즌 부진');
  else if (formDrop)           tags.push('⚠️ 폼 하락');
  else if (formUnknown && !hasSeason) tags.push('ℹ️ 표본 부족');

  // 예상 낙관 (별도 중립 신호) — 기존 예상-대비 임계 재사용
  if (hasSeason) {
    const t = _RISK.bat;
    const avgOpt = (ros.AVG - season.AVG) > t.seasonAvg;
    const opsOpt = (season.OPS != null && (ros.OPS - season.OPS) > t.seasonOps);
    if (avgOpt || opsOpt) tags.push('ℹ️ 예상 낙관');
  }
  return tags;
}

function _calcRiskTags(player) {
  // 타자는 리그 바닥 기준 로직으로, 투수는 아래 기존(예상 대비) 로직으로.
  if (!player.pitcher) return _calcBatterRiskTags(player);
  // Returns array of warning tags. Empty = no risk signal.
  // Logic: 실측(long-window: 시즌 또는 30d / short-window: 14d 또는 7d)
  //         vs projection(proj_ros). 임계값 초과 시 위험.
  // waiver 후보는 종종 season/14d가 비어 있고 proj_ros + projected만 있음
  // (스크래퍼 union 한계). 그럴 땐 30d/7d로 폴백, 둘 다 없으면 ℹ️ 데이터
  // 부족 태그를 줘서 LLM이 risk 판단 불가임을 알 수 있게 한다.
  const ros = player.stats['proj_ros'] || {};
  const seasonRaw = player.stats['2026'] || player.stats['season'] || {};
  const d30 = player.stats['30d'] || {};
  const d14 = player.stats['14d'] || {};
  const d7  = player.stats['7d'] || {};
  const positions = player.positions || [];
  const isPitcher = !!player.pitcher;
  // 듀얼(SP+RP)은 SP 기준(더 엄격) 적용
  const role = isPitcher
    ? (positions.includes('SP') ? 'sp' : 'rp')
    : 'bat';

  // Track raw data presence (any non-empty stats dict) separately from IP-gated
  // source selection. This lets us distinguish two failure modes:
  //  · "데이터 없음": waiver 정렬 상위 미달 → stats 자체가 비어 있음 (약한 음성)
  //  · "표본 부족": stats 있으나 IP 게이트 미달 → noise 가능, 평가 보류
  const longHasData =
    (seasonRaw && Object.keys(seasonRaw).length) ||
    (d30 && Object.keys(d30).length);
  const shortHasData =
    (d14 && Object.keys(d14).length) ||
    (d7 && Object.keys(d7).length);

  // proj_ros 자체가 비어 있으면 실측-vs-예상 위험 판정이 불가능하다. 예전엔 합성
  // 점수가 0 이 돼 조용히 하위 정렬로 밀렸다(예: 시즌 17HR 인데 ROS "—"). 이제
  // 명시 태그로 승격해 LLM 이 시즌·30일로 수동 검토하도록 한다.
  const rosRate = isPitcher ? ros.ERA : ros.AVG;
  if (!(rosRate > 0)) {
    return (longHasData || shortHasData) ? ['ℹ️ ROS 결측'] : ['ℹ️ 데이터 없음'];
  }

  // Pick long-window source (season > 30d) gated by IP for pitchers.
  let longSrc = null;
  if (isPitcher) {
    const t = _RISK[role];
    if ((seasonRaw.IP || 0) >= t.seasonIp) longSrc = seasonRaw;
    else if ((d30.IP || 0) >= t.d30Ip) longSrc = d30;
  } else {
    if (seasonRaw && Object.keys(seasonRaw).length) longSrc = seasonRaw;
    else if (d30 && Object.keys(d30).length) longSrc = d30;
  }

  // Pick short-window source (14d > 7d).
  let shortSrc = null;
  if (isPitcher) {
    const t = _RISK[role];
    if ((d14.IP || 0) >= t.d14Ip) shortSrc = d14;
    else if ((d7.IP || 0) >= t.d7Ip) shortSrc = d7;
  } else {
    if (d14 && Object.keys(d14).length) shortSrc = d14;
    else if (d7 && Object.keys(d7).length) shortSrc = d7;
  }

  // Coverage signals — split into two distinct tags
  if (!longSrc && !shortSrc) {
    if (longHasData || shortHasData) return ['ℹ️ 표본 부족'];
    return ['ℹ️ 데이터 없음'];
  }

  let longBad = false;
  let shortBad = false;

  // 절대 gap (a) 과 비율 gap (r) 의 OR — 둘 중 하나면 bad.
  // 비율 gap 은 elite 자원이 평소 대비 부진할 때만 잡히고
  // (ERA 2 → 3 = ratio 1.50), 절대 gap 은 평균 자원 큰 부진에 강함
  // (ERA 4 → 5.5 = +1.5). 둘 다 두면 보완.
  const _gtA = (a, b, thr) => (a != null && b != null && (a - b) > thr);
  const _gtR = (num, den, thr) => (num != null && den != null && den > 0 && num / den > thr);
  const _ltR = (num, den, thr) => (num != null && den != null && den > 0 && num / den < thr);

  if (isPitcher) {
    const t = _RISK[role];
    if (longSrc) {
      if (_gtA(longSrc.ERA,  ros.ERA,  t.seasonEra)
       || _gtR(longSrc.ERA,  ros.ERA,  t.seasonEraRatio))  longBad = true;
      if (_gtA(longSrc.WHIP, ros.WHIP, t.seasonWhip)
       || _gtR(longSrc.WHIP, ros.WHIP, t.seasonWhipRatio)) longBad = true;
    }
    if (shortSrc) {
      if (_gtA(shortSrc.ERA,  ros.ERA,  t.d14Era)
       || _gtR(shortSrc.ERA,  ros.ERA,  t.d14EraRatio))  shortBad = true;
      if (_gtA(shortSrc.WHIP, ros.WHIP, t.d14Whip)
       || _gtR(shortSrc.WHIP, ros.WHIP, t.d14WhipRatio)) shortBad = true;
    }
  } else {
    const t = _RISK.bat;
    if (longSrc) {
      if (_gtA(ros.AVG, longSrc.AVG, t.seasonAvg)
       || _ltR(longSrc.AVG, ros.AVG, t.seasonAvgRatio)) longBad = true;
      if (_gtA(ros.OPS, longSrc.OPS, t.seasonOps)
       || _ltR(longSrc.OPS, ros.OPS, t.seasonOpsRatio)) longBad = true;
    }
    if (shortSrc) {
      if (_gtA(ros.AVG, shortSrc.AVG, t.d14Avg)
       || _ltR(shortSrc.AVG, ros.AVG, t.d14AvgRatio)) shortBad = true;
      if (_gtA(ros.OPS, shortSrc.OPS, t.d14Ops)
       || _ltR(shortSrc.OPS, ros.OPS, t.d14OpsRatio)) shortBad = true;
    }
  }

  const tags = [];
  if (longBad && shortBad) tags.push('⚠️⚠️ 추천 위험');
  else if (longBad) tags.push('⚠️ 시즌 부진');
  else if (shortBad) tags.push('⚠️ 폼 하락');
  return tags;
}

function _tableRow(label, stats, cols) {
  const vals = cols.map(c => _fmt(c, stats ? stats[c] : null));
  return '| ' + label + ' | ' + vals.join(' | ') + ' |';
}

// Smart 25: 3-axis union
function _formScore(ap) {
  const s = ap.stats['7d'] || ap.stats['projected'];
  if (!s) return null;
  const ip = s.IP || 0;
  const minIp = ap.pitcher ? 2.0 : 1.0;
  if (ip < minIp) return null;
  if (ap.pitcher) {
    const svh = (s['SV+H'] || 0);
    const k = (s.K || 0);
    const er = Math.max(0, ip * ((s.ERA || 0) / 9));
    const raw = svh * 3.0 + k * 0.5 - er * 1.0;
    return raw * Math.sqrt(Math.min(ip, 10.0));
  } else {
    // batter
    const raw = (s.R||0)*1.0 + (s.HR||0)*2.0 + (s.RBI||0)*1.0 + (s.SB||0)*1.5;
    const pa = s['PA'] || ip || 5;
    return raw * Math.sqrt(Math.min(pa, 25.0));
  }
}

// ── SP/RP team-level pickup prompt ───────────────────────────────────────────

function _pickupSummaryLine(pitcherType, myPitchers, cats) {
  // "내 SP 합계: K=X (5위 vs 1위 Y, ↑Z) ..." 같은 한 줄 진단.
  // 카테고리 SP 픽업의 직접 영향(W/K/ERA/WHIP) 또는 RP의 직접 영향(SV+H/K/ERA/WHIP)에
  // 대해 내 합계와 standings에서의 위치를 짝지어 보여준다.
  if (!cats || !cats.length) return '';
  const focusKeys = pitcherType === 'SP'
    ? ['IP', 'W', 'K', 'ERA', 'WHIP']
    : ['SV+H', 'K', 'ERA', 'WHIP', 'IP'];
  const sums = {};
  for (const k of focusKeys) sums[k] = 0;
  let n = 0;
  for (const p of myPitchers) {
    const ros = p.stats['proj_ros'] || {};
    n++;
    for (const k of focusKeys) {
      if (ros[k] !== null && ros[k] !== undefined) sums[k] += ros[k];
    }
  }
  if (!n) return '';
  // ratio 스탯(ERA/WHIP)은 합산 의미 없으니 평균
  const ratioKeys = new Set(['ERA', 'WHIP']);
  const parts = [];
  for (const k of focusKeys) {
    const isRatio = ratioKeys.has(k);
    const myVal = isRatio ? (sums[k] / n) : sums[k];
    const cat = cats.find(c => c.category === k);
    let suffix = '';
    if (cat) suffix = ' (' + cat.rank + '위 vs 1위 ' + _fmtCat(k, cat.value_leader) + ')';
    parts.push(k + '=' + _fmtCat(k, myVal) + suffix);
  }
  return parts.join(', ');
}

function _sortedPitcherCandidates(pitcherType, n) {
  // 2축 union: proj_ros 합성(잔여 가치) 상위 + 2026 시즌 합성(시즌 검증) 상위.
  // 단일 정렬(proj_ros만)은 projection 강한 후보가 풀을 독점하고, 그 후보들은
  // 종종 시즌 정렬에 안 들어 시즌 데이터가 빈다(스크래퍼 union 한계). 두 축으로
  // 뽑으면 (a) 시즌 검증된 후보가 풀에 들어오고 (b) 그 후보들의 시즌 데이터는
  // 자동으로 채워져 있어 risk 태그 평가 가능.
  // SP: K + W*5 (W가 K의 ~15분의 1 볼륨이라 가중). RP: SV+H 단일.
  const pool = (DATA.available[pitcherType] || []).slice();
  const halfN = Math.ceil(n / 2);

  function _spScore(stats) {
    return (stats.K || 0) + (stats.W || 0) * 5;
  }
  function _rpScore(stats) {
    return stats['SV+H'] || 0;
  }
  const scoreFn = pitcherType === 'SP' ? _spScore : _rpScore;

  function _projStats(p)   { return p.stats['proj_ros'] || {}; }
  function _seasonStats(p) { return p.stats['2026'] || p.stats['season'] || {}; }
  const byProj = [...pool].sort((a, b) =>
    scoreFn(_projStats(b)) - scoreFn(_projStats(a))
  ).slice(0, halfN);
  const bySeason = [...pool].sort((a, b) =>
    scoreFn(_seasonStats(b)) - scoreFn(_seasonStats(a))
  ).slice(0, halfN);

  const seen = new Set();
  const result = [];
  for (const p of byProj) {
    if (!seen.has(p.id)) { seen.add(p.id); result.push(p); }
  }
  for (const p of bySeason) {
    if (!seen.has(p.id)) { seen.add(p.id); result.push(p); }
  }
  return result;
}

function buildPitcherPickupPrompt(pitcherType) {
  const lines = [];
  const decisionKey = pitcherType.toLowerCase();
  lines.push('[데이터 기준: ' + DATA.meta.generated_at + ']');
  lines.push(_tierMetaLine());
  lines.push('');

  // 1. Standings + 카테고리 우선순위
  const cats = DATA.standings
    ? (pitcherType === 'SP' ? DATA.standings.all_cats_sp : DATA.standings.all_cats_rp)
    : null;
  if (DATA.standings) {
    const st = DATA.standings;
    lines.push('## 우리 팀: ' + st.my_team_name + ' (' + st.total_teams + '팀 Roto)');
    lines.push('');
    lines.push('| 카테고리 | 내 순위 | 내 값 | 1위 값 |');
    lines.push('|---|---|---|---|');
    for (const c of cats) {
      lines.push('| ' + c.category + ' | ' + c.rank + '위 | '
        + _fmtCat(c.category, c.value) + ' | '
        + _fmtCat(c.category, c.value_leader) + ' |');
    }
    lines.push('');

    lines.push('### 카테고리 우선순위 (' + pitcherType + ' 픽업 관점)');
    lines.push('');
    if (pitcherType === 'SP') {
      lines.push('이 결정: SP 픽업 — 매주 1-2등판. W·K·ERA·WHIP 직접 영향. SV+H·IP는 이 결정으로 바뀌지 않음.');
    } else {
      lines.push('이 결정: RP 픽업 — 매주 3-5등판. SV+H·ERA·WHIP·K 직접 영향. W는 부수적.');
    }
    lines.push('');

    const grp = {high: [], low: [], normal: []};
    for (const c of cats) {
      const k = c.impact || 'normal';
      if (grp[k]) grp[k].push('- ' + c.category + ': ' + c.tier + ' — ' + c.note);
    }
    if (grp.high.length) {
      lines.push('직접 영향 (이 결정으로 따낼 수 있는 점수):');
      grp.high.forEach(l => lines.push(l));
      lines.push('');
    }
    if (grp.low.length) {
      lines.push('한계 영향:');
      grp.low.forEach(l => lines.push(l));
      lines.push('');
    }
    if (grp.normal.length) {
      lines.push('참고:');
      grp.normal.forEach(l => lines.push(l));
      lines.push('');
    }
  }

  // 2. 내 투수진 현황 표 — tier 분류 + 듀얼 자격 분리
  const spTiers = DATA.roster_sp_tiers || {};
  const spTierDetails = (DATA.roster_sp_tier_details || []).reduce(
    (acc, d) => { acc[d.player_id] = d; return acc; }, {}
  );
  const todaySpIds = new Set(DATA.sp_starting_today || []);
  const tomorrowSpIds = new Set(DATA.sp_starting_tomorrow || []);
  const myCols = pitcherType === 'SP'
    ? ['IP', 'W', 'K', 'ERA', 'WHIP']
    : ['SV+H', 'K', 'ERA', 'WHIP', 'IP'];

  // 모든 기간을 셀로 보여준다. 우리 로스터 선수는 6개 기간 모두 수집되므로
  // 단기(7d/14d/30d) → 시즌(2026) → 미래(projected/proj_ros) 흐름을 LLM이
  // 한 행에서 비교할 수 있어야 단발 등판/장기 가치/회복 추세 판단이 정확해진다.
  const _PITCHER_PERIODS = [
    {key: '7d',        label: '7d'},
    {key: '14d',       label: '14d'},
    {key: '30d',       label: '30d'},
    {key: '2026',      label: '2026'},
    {key: 'projected', label: '다음7일'},
    {key: 'proj_ros',  label: '잔여'},
  ];

  function _pitcherTableHeader(cols) {
    const periodHeaders = _PITCHER_PERIODS.map(
      pe => pe.label + ' ' + cols.join('/')
    ).join(' | ');
    const sep = ['---', '---', '---'].concat(_PITCHER_PERIODS.map(() => '---')).join('|');
    return [
      '| 선수 | 슬롯 | 부상 | ' + periodHeaders + ' |',
      '|' + sep + '|',
    ];
  }

  function _renderPitcherRow(p, cols, opts) {
    // cols: which stat columns to render (SP cols vs RP cols).
    // opts.showRpEligibility: when true, append " (RP)" to slot for SP+RP duals
    // (used in the SP-roster table inside the RP pickup prompt so the LLM can
    // see which SPs are RP-eligible and could fill an RP slot directly).
    opts = opts || {};
    const periodCells = _PITCHER_PERIODS.map(pe => {
      const s = p.stats[pe.key] || {};
      return cols.map(c => _fmt(c, s[c])).join('/');
    });
    const tags = [];
    if (spTiers[p.id]) {
      const det = spTierDetails[p.id];
      const score = det && det.core_score != null
        ? '·' + Number(det.core_score).toFixed(0)
        : '';
      tags.push(spTiers[p.id] + score);
    }
    // 다음 등판 예정일(있으면) 또는 마지막 등판일(예정 없으면). SP 만 채워짐.
    const _nd = (DATA.sp_next_start_days || {})[p.id];
    const _ndate = (DATA.sp_next_start_dates || {})[p.id];
    const _ldate = (DATA.sp_last_start_dates || {})[p.id];
    if (_nd === 0) tags.push('🔄 오늘 등판' + (_ndate ? ' ' + _shortDate(_ndate) : ''));
    else if (_nd === 1) tags.push('🔄 내일 등판' + (_ndate ? ' ' + _shortDate(_ndate) : ''));
    else if (_nd != null) tags.push('다음 등판 ' + (_ndate ? _shortDate(_ndate) : '?') + ' (' + _nd + '일 후)');
    else if (_ldate) tags.push('등판예정 없음·마지막 ' + _shortDate(_ldate));
    for (const r of _calcRiskTags(p)) tags.push(r);
    const tagStr = tags.length ? ' [' + tags.join('·') + ']' : '';
    let slot = p.slot || '-';
    if (opts.showRpEligibility && (p.positions || []).includes('RP')) {
      slot += ' (RP 자격)';
    }
    return '| ' + p.name + tagStr + ' | ' + slot + ' | ' + p.injury
      + ' | ' + periodCells.join(' | ') + ' |';
  }

  if (pitcherType === 'SP') {
    const mySps = DATA.roster.filter(p => p.pitcher && (p.positions || []).includes('SP'));
    lines.push('## 내 SP 현황 (' + mySps.length + '명)');
    lines.push('');
    lines.push('태그: [Core/Conditional/Streaming] = `0.50 × value + 0.30 × team_fit + 0.20 × reacquire`, value=`0.6 ros_value(잔여시즌 투영) + 0.4 form_value(최근 폼: 14d/30d/시즌 K/IP·WHIP·워크로드)`. 풀=내 로스터+%Ros≥5% waiver SP/RP. 임계값: ≥65 Core / 50~65 Conditional / <50 Streaming. [🔄 오늘/내일 등판]=MLB 일정 — 단발 가치 자원이라 보유 결정과 별도. 위험 태그=실측 vs ROS 절대 gap **OR 비율 gap** (elite 자원 평소 대비 부진도 잡힘).');
    lines.push('');
    for (const h of _pitcherTableHeader(myCols)) lines.push(h);
    for (const p of mySps) lines.push(_renderPitcherRow(p, myCols));
    lines.push('');

    const summary = _pickupSummaryLine('SP', mySps, cats);
    if (summary) {
      lines.push('내 SP 잔여시즌 합계 (ratio는 평균): ' + summary);
      lines.push('');
    }
    // tier 분해 — 우리 SP 전체 (왜 Core/Conditional/Streaming인지 component 가시화)
    for (const h of _spTierBreakdownLines(mySps.map(p => p.id))) lines.push(h);

    // 내 RP 현황 참조 — SP 를 drop 하고 그 자리에 RP 를 픽업하는 선택지가 있어
    // RP 진영도 함께 노출한다. (RP 픽업 프롬프트가 SP 표를 함께 보여주는 것의 대칭.)
    const myRps = DATA.roster.filter(p => p.pitcher && (p.positions || []).includes('RP'));
    const pureRps = myRps.filter(p => !spTiers[p.id]);
    if (pureRps.length) {
      const rpCols = ['SV+H', 'K', 'ERA', 'WHIP', 'IP'];
      lines.push('## 내 RP 현황 (실제 RP ' + pureRps.length + '명) — 참조: SP 정리 후 RP 픽업 판단용');
      lines.push('');
      lines.push('SP 자리를 비워 RP 를 픽업하는 선택지가 있어 함께 표시. 컬럼은 RP 기준(SV+H/K/ERA/WHIP/IP). SP/RP 듀얼 자격 선수는 위 SP 표에 있음.');
      lines.push('');
      for (const h of _pitcherTableHeader(rpCols)) lines.push(h);
      for (const p of pureRps) lines.push(_renderPitcherRow(p, rpCols));
      lines.push('');
    }
  } else {
    // RP 분기: 실제 RP 표 + SP 진영 전체 표(RP 자리를 만들기 위한 정리 후보 검토용).
    // 이전에는 "RP 자격 있는 SP 듀얼"만 분리해 보여줬는데, 그러면 RP 자격이
    // 없는 Streaming SP(예: Christian Scott, Canning)는 표에 안 보임.
    // 사용자 결정 흐름은 "어느 SP를 정리해서 RP 자리로 전환할지"이므로 SP
    // 자격 전체를 보여주는 게 맞음. 듀얼 자격은 슬롯 옆 "(RP 자격)" 표시로 전달.
    const myRps = DATA.roster.filter(p => p.pitcher && (p.positions || []).includes('RP'));
    const pureRps = myRps.filter(p => !spTiers[p.id]);

    lines.push('## 내 RP 현황 (실제 RP ' + pureRps.length + '명)');
    lines.push('');
    for (const h of _pitcherTableHeader(myCols)) lines.push(h);
    for (const p of pureRps) lines.push(_renderPitcherRow(p, myCols));
    lines.push('');

    const summaryPure = _pickupSummaryLine('RP', pureRps, cats);
    if (summaryPure) {
      lines.push('내 실제 RP 잔여시즌 합계 (ratio는 평균): ' + summaryPure);
      lines.push('');
    }

    // SP 진영 전체 표 — RP 자리 마련을 위한 정리 후보 검토
    const mySps = DATA.roster.filter(p => p.pitcher && (p.positions || []).includes('SP'));
    if (mySps.length) {
      lines.push('## 내 SP 진영 (' + mySps.length + '명) — RP 자리 마련을 위한 정리 후보 검토용');
      lines.push('');
      lines.push('태그 의미: [Core/Conditional/Streaming] = `0.50 value + 0.30 team_fit + 0.20 reacquire`, value=`0.6 ros_value(투영)+0.4 form_value(최근)`. 풀=내 로스터+active waiver SP/RP. ≥65 Core / 50~65 Conditional / <50 Streaming. [🔄 오늘/내일 등판]=MLB 일정. 슬롯 옆 (RP 자격) = SP/RP 듀얼 자격이라 RP 슬롯 직투입 가능. **Streaming tier + 등판 태그 붙은 SP는 등판 후 정리해서 RP 자리로 전환 가능**. Core/Conditional은 장기 보유 자원이라 자르지 말 것.');
      lines.push('');
      const spCols = ['IP', 'W', 'K', 'ERA', 'WHIP'];
      for (const h of _pitcherTableHeader(spCols)) lines.push(h);
      for (const p of mySps) {
        lines.push(_renderPitcherRow(p, spCols, {showRpEligibility: true}));
      }
      lines.push('');
      // tier 분해 — SP 진영 (어느 SP를 정리할지 선택 근거)
      for (const h of _spTierBreakdownLines(mySps.map(p => p.id))) lines.push(h);
    }
  }

  // 3. Available 후보 — 2축 union (각 축 상위 절반씩, 중복 제거)
  const candN = 30;
  const sortLabel = pitcherType === 'SP'
    ? 'proj_ros K+W*5 상위 15 ∪ 2026 시즌 K+W*5 상위 15'
    : 'proj_ros SV+H 상위 15 ∪ 2026 시즌 SV+H 상위 15';
  const candidates = _sortedPitcherCandidates(pitcherType, candN);
  lines.push('## ' + pitcherType + ' 보강 후보 (' + candidates.length + '명, ' + sortLabel + ')');
  lines.push('');
  for (const ap of candidates) {
    const hotTag = ap.is_hot ? ' 🔥' : '';
    const risk = _calcRiskTags(ap);
    const riskStr = risk.length ? ' [' + risk.join('·') + ']' : '';
    lines.push('### ' + ap.name + ' (' + ap.team + ')' + hotTag + riskStr
      + '  픽업률 ' + (ap.add_pct || 0) + '%  부상: ' + ap.injury);
    lines.push(_tableHeader(myCols));
    for (const period of DATA.periods) {
      const label = DATA.period_labels[period];
      // "7d → projected" fallback은 잘못된 매핑 (next 7d projection을 last 7d
      // 실측으로 표시). 제거. "2026 → season"은 같은 시즌 누적이라 OK.
      const stats = ap.stats[period]
        || (period === '2026' ? ap.stats['season'] : null)
        || null;
      lines.push(_tableRow(label, stats, myCols));
    }
    lines.push('');
  }

  // 4. 질문 + 답변 형식
  lines.push('## 요청');
  lines.push('');
  if (pitcherType === 'SP') {
    lines.push('내 SP 진영을 보고, 가장 약한 자리 1개와 그 자리에 가져올 후보 1명을 추천해라.');
    lines.push('- 직접 영향 카테고리(공략권) 기준으로 무엇을 우선 보강할지 명확히');
    lines.push('- 잔여시즌 K·W·ERA·WHIP 4축으로 비교');
    lines.push('- 14일 폼이 잔여시즌 프로젝션과 크게 다르면 언급');
    lines.push('- **자원 종류 분리**: [Streaming] tier 또는 [🔄 오늘/내일 등판] 태그가 붙은 SP는 단발/스트리밍 슬롯으로 봐야 한다 — 등판 후 정리 가능한 자원. [Core] / [Conditional]은 장기 보유 자원이라 같은 풀로 비교하면 안 됨.');
    lines.push('- **drop 대상 5일 룰 (반드시 준수)**: SP를 drop 후보로 고를 때 "다음 등판"이 **5일 이내**(오늘~4일 후)면 이번 사이클 drop 대상에서 **제외**한다. 이유: 웨이버 클레임이 약 3일 걸려서, 버리고 다시 데려오려면 그 SP의 다음 등판이 최소 5일 뒤여야 등판을 놓치지 않는다. "다음 등판"이 **"drop가능"**(5일+ 또는 등판 예정 없음)으로 표시된 SP만 drop 후보로 삼아라. 결론에서 "오늘 등판 없음"은 근거가 안 되고 "향후 5일간 등판 없음"이어야 한다.');
    lines.push('- **위험 태그 규칙 (반드시 준수)**: `[⚠️⚠️ 추천 위험]` = 1순위 금지 / `[⚠️ 시즌 부진]` `[⚠️ 폼 하락]` = ratio 리스크 명시 필수 / `[ℹ️ 데이터 없음]` = 약한 음성 신호 (waiver 정렬 상위 미달, 단 부상은 예외) / `[ℹ️ 표본 부족]` = stats 있지만 IP 표본 작아 noise 가능, 1순위 추천 시 표본 작음 명시 필수. 잔여 예상이 좋아도 실측이 나쁘면 실측 우선.');
    lines.push('- **RP 전환 선택지도 고려**: 위 "내 RP 현황" 표 참조. Streaming tier + drop가능 SP 를 정리하고 그 자리에 RP 를 픽업하는 게 더 나으면 그렇게 추천해도 됨 (특히 SV+H 가 약점일 때). 다만 이 프롬프트의 후보 표는 SP 후보이니, RP 전환이 낫다고 판단되면 "RP 픽업 분석 권장"으로 방향만 제시.');
    lines.push('- "보강 안 하고 Hold"가 정답이면 그렇게 답해도 됨');
  } else {
    lines.push('내 RP 진영을 보고, 보강이 필요하면 어느 자리에 누구를 가져올지 추천해라.');
    lines.push('- SV+H 누적이 1순위 기준 (사용자 점수 카테고리)');
    lines.push('- K·ERA·WHIP 안전성도 같이 평가');
    lines.push('- 신예 후보(낮은 픽업률 + 높은 SV+H)도 후보에 포함해서 검토');
    lines.push('- **결정 흐름**: 위 표 두 개를 같이 본다.');
    lines.push('  · "실제 RP" 표: RP 보강 1차 비교 대상. 가장 약한 자리부터 교체');
    lines.push('  · "내 SP 진영" 표: RP 자리 마련을 위한 정리 후보. Streaming tier + 등판 태그 = 등판 후 정리해서 RP로 전환 가능. (RP 자격) 슬롯 표시는 RP 슬롯 직접 이동 가능');
    lines.push('  · Core/Conditional SP는 장기 보유 자원이라 RP 자리 마련 위해 자르지 말 것');

// ── SP streaming compare prompt — tomorrow's start swap decision ─────────────

function buildSPStreamComparePrompt() {
  const lines = [];
  lines.push('[데이터 기준: ' + DATA.meta.generated_at + ']');
  lines.push(_tierMetaLine());
  lines.push('');
  lines.push('# 내일 SP 스트림 비교 (one-day swap decision)');
  lines.push('');

  // 1. SP-relevant standings context (compact)
  if (DATA.standings && DATA.standings.all_cats_sp) {
    const high = DATA.standings.all_cats_sp.filter(c => (c.impact || 'normal') === 'high');
    if (high.length) {
      lines.push('SP 직접 영향 카테고리:');
      high.forEach(c => lines.push('- ' + c.category + ': ' + c.tier + ' — ' + c.note));
      lines.push('');
    }
  }

  // 2. 내 팀 SP 전체 — tier + 다음 등판 + stat
  // Streaming tier가 교체 1순위, Conditional은 보수적, Core는 보호.
  lines.push('## 내 팀 SP 전체');
  lines.push('');
  lines.push('태그 의미: [Core/Conditional/Streaming] = `0.50 value + 0.30 team_fit + 0.20 reacquire`, value=`0.6 ros_value(잔여시즌 투영)+0.4 form_value(최근 14d/30d/시즌 K/IP·WHIP·워크로드)`. 풀=내 로스터+active waiver SP/RP. ≥65 Core / 50~65 Conditional / <50 Streaming. tier 정렬: Streaming(교체 1순위)→Conditional(보수적)→Core(보호).');
  lines.push('');
  const mySps = DATA.roster.filter(p => p.pitcher && (p.positions || []).includes('SP'));
  const spTiers = DATA.roster_sp_tiers || {};
  const spTierDetails = (DATA.roster_sp_tier_details || []).reduce(
    (acc, d) => { acc[d.player_id] = d; return acc; }, {}
  );
  const todaySpIds = new Set(DATA.sp_starting_today || []);
  const tomorrowSpIds = new Set(DATA.sp_starting_tomorrow || []);

  if (mySps.length === 0) {
    lines.push('- (내 SP 없음)');
  } else {
    const cols = ['IP', 'W', 'K', 'ERA', 'WHIP'];
    // 우리 로스터 SP는 6개 기간(7d/14d/30d/2026/projected/proj_ros) 전부 보유.
    // 단발 등판 가치는 단기(7d/14d) 폼이 결정적이고, 잔여 시즌 보유 가치는
    // proj_ros + 2026이 결정적이므로 모두 노출한다.
    const periods = [
      ['7d', '7d'], ['14d', '14d'], ['30d', '30d'],
      ['2026', '2026'], ['projected', '다음7일'], ['proj_ros', '잔여'],
    ];
    const periodHdr = periods.map(([, lbl]) => lbl + ' ' + cols.join('/')).join(' | ');
    const sep = ['---', '---', '---', '---'].concat(periods.map(() => '---')).join('|');
    lines.push('| 이름 | 슬롯 | tier | 다음 등판 | ' + periodHdr + ' |');
    lines.push('|' + sep + '|');
    // tier 정렬: 정리 → 선택 → 보유 → 필수보유 (교체 후보 위로)
    const sorted = mySps.slice().sort((a, b) => {
      const ra = ROSTER_TIER_RANK[spTiers[a.id]] ?? 99;
      const rb = ROSTER_TIER_RANK[spTiers[b.id]] ?? 99;
      return ra - rb;
    });
    for (const p of sorted) {
      const periodCells = periods.map(([k]) => {
        const s = p.stats[k] || {};
        return cols.map(c => _fmt(c, s[c])).join('/');
      });
      const det = spTierDetails[p.id];
      const baseTier = _rosterTierLabel(spTiers[p.id]);
      const tier = det && det.core_score != null
        ? baseTier + '·' + Number(det.core_score).toFixed(0)
        : baseTier;
      const nd = (DATA.sp_next_start_days || {})[p.id];
      const ndate = (DATA.sp_next_start_dates || {})[p.id];
      const ldate = (DATA.sp_last_start_dates || {})[p.id];
      const dstr = ndate ? ' (' + _shortDate(ndate) + ')' : '';
      let nextStart = '-';
      if (nd === 0) nextStart = '🔄 오늘' + dstr;
      else if (nd === 1) nextStart = '🔄 내일' + dstr;
      else if (nd != null && nd < 5) nextStart = nd + '일 후' + dstr;
      else if (nd != null) nextStart = nd + '일 후 · drop가능' + dstr;
      else nextStart = '등판 예정 없음' + (ldate ? ' · 마지막 등판 ' + _shortDate(ldate) : '') + ' · drop가능';
      const slot = p.slot || '-';
      lines.push('| ' + p.name + ' | ' + slot + ' | ' + tier
        + ' | ' + nextStart + ' | ' + periodCells.join(' | ') + ' |');
    }
  }
  lines.push('');
  // tier 분해 — SP swap 결정에 component 근거 제공
  for (const h of _spTierBreakdownLines(mySps.map(p => p.id))) lines.push(h);

  // 내 RP 현황 참조 — one-day swap 에서 SP 자리를 RP 픽업으로 돌리는 선택지 검토용.
  const myRps = DATA.roster.filter(p => p.pitcher && (p.positions || []).includes('RP'));
  const pureRps = myRps.filter(p => !spTiers[p.id]);
  if (pureRps.length) {
    lines.push('## 내 RP 현황 (실제 RP ' + pureRps.length + '명) — 참조: SP 자리를 RP 로 돌릴지 판단용');
    lines.push('');
    lines.push('SP 를 drop 하고 그 자리에 RP 를 픽업하는 선택지가 있어 함께 표시. 컬럼은 RP 기준(SV+H/K/ERA/WHIP/IP). SP/RP 듀얼 자격 선수는 위 SP 표에 있음.');
    lines.push('');
    const rpCols = ['SV+H', 'K', 'ERA', 'WHIP', 'IP'];
    const rpPeriods = [
      ['7d', '7d'], ['14d', '14d'], ['30d', '30d'],
      ['2026', '2026'], ['projected', '다음7일'], ['proj_ros', '잔여'],
    ];
    const rpPeriodHdr = rpPeriods.map(([, lbl]) => lbl + ' ' + rpCols.join('/')).join(' | ');
    const rpSep = ['---', '---', '---'].concat(rpPeriods.map(() => '---')).join('|');
    lines.push('| 이름 | 슬롯 | 부상 | ' + rpPeriodHdr + ' |');
    lines.push('|' + rpSep + '|');
    for (const p of pureRps) {
      const periodCells = rpPeriods.map(([k]) => {
        const s = p.stats[k] || {};
        return rpCols.map(c => _fmt(c, s[c])).join('/');
      });
      const slot = p.slot || '-';
      lines.push('| ' + p.name + ' | ' + slot + ' | ' + (p.injury || '-')
        + ' | ' + periodCells.join(' | ') + ' |');
    }
    lines.push('');
  }

  // 3. 내일 등판 waiver SP — sp_streaming.all_candidates (이미 stream_score 정렬)
  lines.push('## 내일 등판 waiver SP 후보 (stream_score 정렬)');
  lines.push('');
  // Prose from shared Python constants (sp_streaming_prompt_text.py).
  lines.push(..._SP_PROSE.tier_guide);
  lines.push('');
  lines.push(..._SP_PROSE.score_formula);
  lines.push('');
  // 4-tier label helper (mirrors sp_streaming.stream_score_label)
  function _streamTierLabel(s) {
    if (s == null) return '-';
    if (s >= 0.70) return 'Auto-Start';
    if (s >= 0.50) return 'Probably';
    if (s >= 0.30) return 'Questionable';
    return 'Skip';
  }
  const candidates = DATA.sp_stream_compare || [];
  if (candidates.length === 0) {
    lines.push('- (내일 등판 후보 데이터 없음 — cached 모드이거나 F-04c 미실행)');
  } else {
    // 우리 SP 표와 동일한 6 기간을 노출하되 waiver 측은 시즌 키가 'season'.
    // 컬럼: 후보·팀·시작일 + score 4종 + 6 기간(IP/W/K/ERA/WHIP) + %Ros·injury.
    const streamPeriods = [
      {key: '7d',        label: '7d'},
      {key: '14d',       label: '14d'},
      {key: '30d',       label: '30d'},
      {key: 'season',    label: 'season'},
      {key: 'projected', label: '다음7일'},
      {key: 'proj_ros',  label: '잔여'},
    ];
    const sCols = ['IP', 'W', 'K', 'ERA', 'WHIP'];
    const periodHeader = streamPeriods.map(
      pe => pe.label + ' ' + sCols.join('/')
    ).join(' | ');
    // 2-start 판정: 실제 MLB 일정의 다음 7일 등판 횟수 (Python 에서 계산해 전달).
    // ✅=2등판+, —=1등판, ?=일정 없음/불명. (야후 projected GP 는 과다계상이라 미사용.)
    function _isTwoStart(c) {
      return c.two_start || '?';
    }

    const fixedCols = 9;  // 후보·팀·시작일·stream·tier·qs_prob·proj_IP·2-start·components
    const tailCols = 2;   // %Ros · injury
    const sepParts = []
      .concat(Array(fixedCols).fill('---'))
      .concat(streamPeriods.map(() => '---'))
      .concat(Array(tailCols).fill('---'))
      .join('|');
    lines.push('| 후보 | 팀 | 시작일 | stream | tier | qs_prob | proj_IP | 2-start | acc/safety/form/matchup/pq/vegas | '
      + periodHeader + ' | %Ros | injury |');
    lines.push('|' + sepParts + '|');
    const top = candidates.slice(0, 12);
    for (const c of top) {
      const comp = c.components || {};
      const compStr = ['accumulation', 'ratio_safety', 'recent_form', 'matchup', 'pitch_quality', 'vegas_implied']
        .map(k => comp[k] == null ? '-' : Number(comp[k]).toFixed(2)).join('/');
      const periodCells = streamPeriods.map(pe => {
        const s = (c.stats || {})[pe.key] || {};
        return sCols.map(cc => _fmt(cc, s[cc])).join('/');
      });
      const ros = (c.ownership != null) ? Number(c.ownership).toFixed(0) + '%' : '-';
      const tierLabel = _streamTierLabel(c.stream_score);
      const twoStart = _isTwoStart(c);
      lines.push('| ' + c.name + ' | ' + c.team + ' | ' + c.start_date
        + ' | ' + Number(c.stream_score).toFixed(3)
        + ' | ' + tierLabel
        + ' | ' + Number(c.qs_prob).toFixed(2)
        + ' | ' + Number(c.projected_ip).toFixed(1)
        + ' | ' + twoStart
        + ' | ' + compStr + ' | '
        + periodCells.join(' | ')
        + ' | ' + ros + ' | ' + (c.injury || '-') + ' |');
    }

    // 2-a. 상위 5명 stream_score 분해 — 왜 그 tier 인가 component 가시화
    const topFive = candidates.slice(0, 5);
    if (topFive.length) {
      lines.push('');
      lines.push('### Stream Score 상위 5명 분해 (왜 이 tier 인가)');
      lines.push('');
      lines.push(_SP_PROSE.top5_header);
      lines.push(_SP_PROSE.top5_separator);
      for (const c of topFive) {
        const comp = c.components || {};
        const _f = (k) => comp[k] == null ? '-' : Number(comp[k]).toFixed(2);
        const ros = (c.ownership != null) ? Number(c.ownership).toFixed(0) + '%' : '-';
        lines.push('| ' + c.name
          + ' | ' + _streamTierLabel(c.stream_score)
          + ' | ' + Number(c.stream_score).toFixed(3)
          + ' | ' + ros
          + ' | ' + _f('pitch_quality')
          + ' | ' + _f('recent_form')
          + ' | ' + _f('vegas_implied')
          + ' | ' + _f('accumulation')
          + ' | ' + _f('ratio_safety')
          + ' | ' + _f('matchup')
          + ' | ' + Number(c.qs_prob).toFixed(2)
          + ' | ' + _isTwoStart(c)
          + ' |');
      }
      lines.push('');
      lines.push(..._SP_PROSE.interpretation_guide);
    }
  }
  lines.push('');

  // 4. 결정 가이드 + 답변 형식 — shared prose
  lines.push('## 결정');
  lines.push('');
  lines.push(..._SP_PROSE.decision_header);
  lines.push('');
  lines.push(..._SP_PROSE.decision_criteria);
  lines.push('');
  lines.push(..._SP_PROSE.warnings);
  lines.push('');
  lines.push(..._SP_PROSE.response_format);

  return lines.join('\n');
}


function _scrollPromptIntoView() {
  // Mobile layout stacks the prompt panel below the sidebar — without this
  // scroll, tapping a menu leaves the user staring at the (unchanged) sidebar
  // and the freshly rendered prompt is off-screen. Desktop layout is
  // side-by-side, so this is a harmless no-op there.
  const panel = document.querySelector('.prompt-panel');
  if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Batter team-level pickup prompt ──────────────────────────────────────────

function _batterRoster() {
  // 타자 자격(_BAT_POSITIONS) 가진 모든 로스터 선수. IL 제외.
  return DATA.roster.filter(p =>
    !p.pitcher
    && (p.positions || []).some(pos => _BAT_POSITIONS.includes(pos))
    && !(p.slot || '').startsWith('IL')
  );
}

function _batterCandidatesForPos(positionType, n) {
  // 2축 union: proj_ros 합성(잔여 가치) + 2026 시즌 합성(시즌 검증).
  // 각 축 상위 절반씩, 듀얼 자격은 multiplier로 약간 가산.
  const pool = (DATA.available[positionType] || []).slice();
  const halfN = Math.ceil(n / 2);
  // 동적 gap-가중 z-score (정적 합성 대체). 2축: 잔여 projection fit ∪ 시즌 fit.
  const weights = _batCatWeights();
  const projPool   = _batPoolStats('proj_ros', _projOf);
  const seasonPool = _batPoolStats('season',   _seasonOf);
  function _scoreProj(p)   { return _batFit(_projOf(p),   weights, projPool)   * _dualBonus(p.positions); }
  function _scoreSeason(p) { return _batFit(_seasonOf(p), weights, seasonPool) * _dualBonus(p.positions); }
  const byProj = [...pool].sort((a, b) => _scoreProj(b)   - _scoreProj(a)).slice(0, halfN);
  const bySea  = [...pool].sort((a, b) => _scoreSeason(b) - _scoreSeason(a)).slice(0, halfN);
  const seen = new Set();
  const result = [];
  for (const p of byProj) {
    if (!seen.has(p.id)) { seen.add(p.id); result.push(p); }
  }
  for (const p of bySea) {
    if (!seen.has(p.id)) { seen.add(p.id); result.push(p); }
  }
  return result;
}

// 우리 로스터 타자도 6개 기간(7d/14d/30d/2026/projected/proj_ros) 모두 보유.
// SP/RP 표와 동일한 형식으로 한 행에서 단기 폼·시즌 누적·잔여 가치를 비교.
const _BATTER_PERIODS = [
  {key: '7d',        label: '7d'},
  {key: '14d',       label: '14d'},
  {key: '30d',       label: '30d'},
  {key: '2026',      label: '2026'},
  {key: 'projected', label: '다음7일'},
  {key: 'proj_ros',  label: '잔여'},
];

function _batterTableHeader() {
  const cols = DATA.batter_stats;
  const periodHeaders = _BATTER_PERIODS.map(
    pe => pe.label + ' ' + cols.join('/')
  ).join(' | ');
  const sep = ['---', '---', '---'].concat(_BATTER_PERIODS.map(() => '---')).join('|');
  return [
    '| 선수 | 슬롯 | 부상 | ' + periodHeaders + ' |',
    '|' + sep + '|',
  ];
}

function _batterPeriodCell(periodKey, s) {
  // 로스터 타자는 next-7 per-stat projection 이 없어 0 으로 채워진다. 투영 기간
  // (projected/proj_ros)에 rate(AVG)가 0/없음이면 '값 없음'이므로, 오해를 부르는
  // 0/0/0 대신 '—' 로 표기한다. (실측 기간의 실제 0.000 은 유지.)
  s = s || {};
  const cols = DATA.batter_stats;
  const isProj = (periodKey === 'projected' || periodKey === 'proj_ros');
  if (isProj && !(s.AVG > 0)) return '—';
  return cols.map(c => _fmt(c, s[c])).join('/');
}

function _riskTagRuleLine() {
  return '- **위험 태그 규칙 (반드시 준수)** — 리그 꼴찌 팀 기준: `[⚠️⚠️ 추천 위험]`(시즌 **그리고** 폼 둘 다 나쁨) = 1순위 금지 / `[⚠️ 시즌 부진]` = 시즌 AVG·OPS 둘 다 리그 꼴찌 팀 이하 / `[⚠️ 폼 하락]` = 14일(24타석+) AVG·OPS 둘 다 꼴찌 팀 이하(7일 12타석+ 반등이면 해제) / `[ℹ️ 표본 부족]` = 14일 24타석 미만이라 폼 판단 불가(중립·부정 아님) / `[ℹ️ 예상 낙관]` = 잔여 예상이 시즌 실측보다 낙관적(AVG>0.03 또는 OPS>0.08 gap) → ADD 후보 신뢰도 낮음(중립) / `[ℹ️ ROS 결측]` = 잔여 예상 없음 → 시즌·30일로 수동 검토. ⚠️⚠️는 1순위 금지, ℹ️는 정보 신호일 뿐 배제 아님.';
}

function _batterDecisionCore(lines) {
  lines.push('- **공략권(↑) 카테고리에만 높은 가중치.** 잠금(1위·큰 우위)은 이 교체로 딸 점수가 없어 가중치 거의 0. 단 **비율 스탯(AVG·OPS)은 잠금이어도 낮은 비율 후보가 리드를 깎으므로 "방어" 관점으로 감점**하라.');
  lines.push('- **절대 합성 점수가 아니라 "방출 선수 대비 잔여시즌 순증(Δ)"으로 평가.** 후보 잔여 − 방출 선수 잔여를 카테고리별(예: HR +2, AVG +0.01)로 보고, 그 Δ 가 공략권 카테고리 순위를 올리는지로 판단.');
  lines.push('- **14일 폼은 랭킹 근거가 아니라 위험/역할 신호로만.** 14일은 약 50-60타석으로 AVG·OPS·HR 안정화 표본에 못 미쳐 noise. 회귀 반영된 잔여시즌 예상을 신뢰하되, 실측이 예상과 크게 어긋나면(위험 태그) 감점 근거로만.');
  lines.push('- **비율 스탯은 잔여 타석(출장량)과 함께.** 잔여 예상이 비었거나 next-7 이 "—"면 출장 불확실 신호.');
  lines.push('- **재취득 보호**: %Ros 높은 선수 방출은 재취득 어려운 자산 손실 — 명백한 순증 아니면 보호(단 확실한 순증이면 veto 금지).');
  lines.push('- 다중 포지션 자격 = 라인업 유연성 약간 가산 (자격 1개 더 ×1.05).');
  lines.push('- **최선 교체의 공략권 순위 상승 기대가 미미하면(예: 1점 이하) Hold 우선.**');
}

function _renderBatterRow(p, opts) {
  // opts.targetPosition: 현재 분석 포지션. 듀얼 자격 표시할 때 비교용.
  opts = opts || {};
  const periodCells = _BATTER_PERIODS.map(pe => _batterPeriodCell(pe.key, p.stats[pe.key]));
  const tierMap = DATA.roster_batter_tiers || {};
  const batTierDetails = (DATA.roster_batter_tier_details || []).reduce(
    (acc, d) => { acc[d.player_id] = d; return acc; }, {}
  );
  const tags = [];
  if (tierMap[p.id]) {
    const det = batTierDetails[p.id];
    const score = det && det.core_score != null
      ? '·' + Number(det.core_score).toFixed(0)
      : '';
    tags.push(_rosterTierLabel(tierMap[p.id]) + score);
  }
  for (const r of _calcRiskTags(p)) tags.push(r);
  const tagStr = tags.length ? ' [' + tags.join('·') + ']' : '';

  let slot = p.slot || '-';
  if (opts.showOtherPositions) {
    // 분석 포지션을 포함한 전체 자격을 명시한다. (이전엔 분석 포지션을 빼서
    // "내 3B 자격 선수" 표에 3B 가 안 보여 자격 없는 것처럼 오해됨.)
    const batPos = (p.positions || []).filter(pos => _BAT_POSITIONS.includes(pos));
    if (batPos.length) slot += ' (자격: ' + batPos.join('/') + ')';
  }
  return '| ' + p.name + tagStr + ' | ' + slot + ' | ' + p.injury
    + ' | ' + periodCells.join(' | ') + ' |';
}

function _batterStandingsBlock(lines) {
  // 타자 결정 컨텍스트 — categorize.py의 'Batter' 분류.
  if (!DATA.standings) return;
  const st = DATA.standings;
  const cats = st.all_cats_bat;
  lines.push('## 우리 팀: ' + st.my_team_name + ' (' + st.total_teams + '팀 Roto)');
  lines.push('');
  lines.push('| 카테고리 | 내 순위 | 내 값 | 1위 값 |');
  lines.push('|---|---|---|---|');
  for (const c of cats) {
    lines.push('| ' + c.category + ' | ' + c.rank + '위 | '
      + _fmtCat(c.category, c.value) + ' | '
      + _fmtCat(c.category, c.value_leader) + ' |');
  }
  lines.push('');
  lines.push('### 카테고리 우선순위 (타자 픽업 관점)');
  lines.push('');
  lines.push('이 결정: 타자 픽업 — R·HR·RBI·SB·AVG·OPS 직접 영향.');
  lines.push('');
  const grp = {high: [], low: [], normal: []};
  for (const c of cats) {
    const k = c.impact || 'normal';
    if (grp[k]) grp[k].push('- ' + c.category + ': ' + c.tier + ' — ' + c.note);
  }
  if (grp.high.length) {
    lines.push('직접 영향 (이 결정으로 따낼 수 있는 점수):');
    grp.high.forEach(l => lines.push(l));
    lines.push('');
  }
  if (grp.low.length) {
    lines.push('한계 영향:');
    grp.low.forEach(l => lines.push(l));
    lines.push('');
  }
  if (grp.normal.length) {
    lines.push('참고:');
    grp.normal.forEach(l => lines.push(l));
    lines.push('');
  }
}

function _appendBatterAnswerFormat(lines, kind) {
  // kind: 'pos' (단일 포지션) 또는 'all' (종합)
  lines.push('## 답변 형식 (반드시 준수)');
  lines.push('');
  lines.push('### 결론');
  if (kind === 'all') {
    lines.push('- **권장 보강 포지션**: [포지션명] (또는 "Hold" — 어디도 보강 불필요)');
  }
  lines.push('- **권장 액션**: 즉시 교체 / 조건부 교체 / 보류 (Hold) — 셋 중 하나만');
  lines.push('  · "즉시 교체" = 지금 바로 drop/add 실행');
  lines.push('  · "조건부 교체" = 특정 시점/조건 도달 후 실행 (예: 7일 데이터 확인 후)');
  lines.push('  · "보류" = 현 상태 유지');
  lines.push('- 교체 페어: [내 선수] → [후보] (또는 "Hold")');
  lines.push('- **액션 사유**: 한 문장. 위험 태그·tier·실측·카테고리 임팩트 1개 이상 직접 인용');
  lines.push('- **트리거 조건**: 즉시 교체가 아니면 어떤 조건이 만족돼야 실행되는지 (또는 보류면 무엇이 바뀌면 재검토하는지) 구체적으로');
  lines.push('');
  lines.push('### Top 3 후보 비교');
  lines.push('(**방출 선수 대비 공략권 카테고리 순증 Δ 기준** 상위 3명 — 절대 합성 점수 아님)');
  lines.push('| 후보 | 방출선수 대비 Δ (공략권: HR/AVG/OPS 등) | 리스크 | 추천 순위 |');
  lines.push('|---|---|---|---|');
  lines.push('');
  lines.push('### 근거');
  lines.push('[3-5문장 — 결론의 액션 사유를 더 자세히 풀어쓰기. 데이터 인용 필수]');
}

function buildBatterPickupPrompt(positionType) {
  // positionType: 'C' / '1B' / '2B' / '3B' / 'SS' / 'OF'
  const lines = [];
  lines.push('[데이터 기준: ' + DATA.meta.generated_at + ']');
  lines.push(_tierMetaLine());
  lines.push('');

  _batterStandingsBlock(lines);

  // 내 진영 — 해당 포지션 자격 보유한 모든 타자 (BN/슬롯 포함)
  const myPlayers = _batterRoster().filter(p =>
    (p.positions || []).includes(positionType)
  );
  lines.push('## 내 ' + positionType + ' 자격 선수 (' + myPlayers.length + '명)');
  lines.push('');
  lines.push('태그 의미: [Core/Conditional/Fringe] = `0.30 asset + 0.25 reacquire + 0.25 ros_outlook + 0.20 team_fit`, 풀=내 로스터 타자. ≥65 Core / 45~65 Conditional / <45 Fringe (OUT 부상은 강제 Fringe). asset=preseason+current rank (시즌 진행도 자동 가중: 4월 60/40 → 9월 20/80), ros_outlook=R/HR/RBI/SB/AVG/OPS 6-cat z-score sigmoid, team_fit=약점 카테고리 적합도. [⚠️/ℹ️] = 위험·데이터 신호 (⚠️ 시즌부진/폼하락 = 리그 꼴찌 팀 기준, ℹ️ 예상낙관/표본부족/ROS결측 = 중립 — 아래 규칙 참조). 슬롯 옆 (X/Y 자격) = 다중 포지션 자격.');
  lines.push('');
  const cols = DATA.batter_stats;
  for (const h of _batterTableHeader()) lines.push(h);
  for (const p of myPlayers) {
    lines.push(_renderBatterRow(p, {showOtherPositions: true, targetPosition: positionType}));
  }
  lines.push('');
  // tier 분해 — 해당 포지션 자격 우리 타자 (왜 이 tier인지 component 가시화)
  for (const h of _batterTierBreakdownLines(
    myPlayers.map(p => p.id), '우리 ' + positionType + ' 자격 선수'
  )) lines.push(h);

  // 나머지 타자 참조 — 해당 포지션 자격 밖의 로스터 타자 성적. 방출 후보 선정·
  // 라인업 균형 판단에 전체 타자 그림이 필요해 자격 선수 표 아래에 추가한다.
  const otherBatters = _batterRoster().filter(p => !(p.positions || []).includes(positionType));
  if (otherBatters.length) {
    lines.push('## 내 나머지 타자 (' + otherBatters.length + '명, ' + positionType + ' 자격 외 — 참조용)');
    lines.push('');
    lines.push('위 ' + positionType + ' 자격 선수 외 로스터 타자 전체 성적. ' + positionType + ' 보강을 위해 다른 포지션 타자를 방출하는 선택지나 라인업 전체 균형을 볼 때 참고. 슬롯 옆 (자격: ...) = 타자 포지션 자격. **이 표의 선수는 ' + positionType + ' 자격이 아니므로 ' + positionType + ' 슬롯 직접 대체는 불가** — 방출 후보/전체 맥락 용도.');
    lines.push('');
    for (const h of _batterTableHeader()) lines.push(h);
    for (const p of otherBatters) {
      lines.push(_renderBatterRow(p, {showOtherPositions: true, targetPosition: positionType}));
    }
    lines.push('');
  }

  // Available 후보 — 이 포지션 풀에서 30명 (2축 union)
  const weights = _batCatWeights();
  const dropTarget = _weakestBatterAt(positionType);
  const projPool = _batPoolStats('proj_ros', _projOf);
  const teamTot = _teamRateTotals();
  const candidates = _batterCandidatesForPos(positionType, 30);
  lines.push('## ' + positionType + ' 보강 후보 (' + candidates.length + '명, gap-가중 z-score 상위 ∪ 시즌 fit 상위, 다중 자격 ×1.05~1.10)');
  lines.push('점수 = Σ (카테고리 gap 가중 × 후보 잔여 z-score). 공략권 1.0 / 경쟁권 0.5 / 잠금·포기권 0.15 — 잠긴 카테고리는 거의 무가치, rate 리드는 낮게라도 방어.');
  if (dropTarget) {
    lines.push('방출 대상(최약체 ' + positionType + ' 자격) = **' + dropTarget.name + '**. 각 후보에 "방출대상 대비 잔여 Δ"를 엔진이 계산해 표시 — 절대값이 아니라 이 Δ 로 판단.');
  }
  lines.push('');
  for (const ap of candidates) {
    const hotTag = ap.is_hot ? ' 🔥' : '';
    const risk = _calcRiskTags(ap);
    const riskStr = risk.length ? ' [' + risk.join('·') + ']' : '';
    const otherPos = (ap.positions || []).filter(p => _BAT_POSITIONS.includes(p) && p !== positionType);
    const dualStr = otherPos.length ? ' (' + otherPos.join('/') + ' 자격)' : '';
    const fit = _batFit(_projOf(ap), weights, projPool) * _dualBonus(ap.positions);
    lines.push('### ' + ap.name + ' (' + ap.team + ')' + hotTag + riskStr + dualStr
      + '  픽업률 ' + (ap.add_pct || 0) + '%  부상: ' + ap.injury
      + '  · 적합 ' + (fit >= 0 ? '+' : '') + fit.toFixed(2));
    const dl = _deltaVsDropLine(ap, dropTarget, weights, teamTot);
    if (dl) lines.push(dl);
    lines.push(_tableHeader(cols));
    for (const period of DATA.periods) {
      const label = DATA.period_labels[period];
      // "7d → projected" fallback은 잘못된 매핑 (next 7d projection을 last 7d
      // 실측으로 표시). 제거. "2026 → season"은 같은 시즌 누적이라 OK.
      const stats = ap.stats[period]
        || (period === '2026' ? ap.stats['season'] : null)
        || null;
      lines.push(_tableRow(label, stats, cols));
    }
    lines.push('');
  }

  // 요청 + 답변 형식
  lines.push('## 요청');
  lines.push('');
  lines.push('내 ' + positionType + ' 자격 선수와 위 후보를 비교해서, 보강 결정을 내려라.');
  lines.push('- 먼저 위 "카테고리 우선순위"에서 **공략권(↑) 카테고리**가 무엇인지 확인하라 (이 교체로 실제 순위점을 딸 수 있는 카테고리).');
  _batterDecisionCore(lines);
  lines.push(_riskTagRuleLine());
  lines.push('- "보강 안 하고 Hold"가 정답이면 그렇게 답해도 됨');
  lines.push('');
  _appendBatterAnswerFormat(lines, 'pos');

  return lines.join('\n');
}

function buildBatterAllPickupPrompt() {
  // 종합: 모든 타자 + 모든 포지션 후보 10명씩 = 60명. LLM이 어느 포지션
  // 보강이 가장 효율적인지부터 판단.
  const lines = [];
  lines.push('[데이터 기준: ' + DATA.meta.generated_at + ']');
  lines.push(_tierMetaLine());
  lines.push('');

  _batterStandingsBlock(lines);

  // 내 진영 — 모든 타자 (한 표에)
  const myPlayers = _batterRoster();
  lines.push('## 내 타자 진영 (' + myPlayers.length + '명)');
  lines.push('');
  lines.push('태그 의미: [Core/Conditional/Fringe] = `0.30 asset + 0.25 reacquire + 0.25 ros_outlook + 0.20 team_fit`, 풀=내 로스터 타자. ≥65 Core / 45~65 Conditional / <45 Fringe (OUT 강제 Fringe). asset 시즌 진행도 가중, ros_outlook은 6-cat z-score sigmoid, team_fit은 약점 카테고리 적합도. [⚠️/ℹ️] = 위험·데이터 신호 (⚠️ 시즌부진/폼하락 = 리그 꼴찌 팀 기준, ℹ️ 예상낙관/표본부족/ROS결측 = 중립 — 아래 규칙 참조). 슬롯 옆 (X/Y) = 다중 포지션 자격.');
  lines.push('');
  const cols = DATA.batter_stats;
  for (const h of _batterTableHeader()) lines.push(h);
  for (const p of myPlayers) {
    lines.push(_renderBatterRow(p, {showOtherPositions: true}));
  }
  lines.push('');
  // tier 분해 — 우리 타자 전체 (포지션별 의사결정에 component 근거 제공)
  for (const h of _batterTierBreakdownLines(
    myPlayers.map(p => p.id), '우리 타자 전체'
  )) lines.push(h);

  // 포지션별 후보 — 각 10명씩 union (중복 제거)
  const seen = new Set();
  const sectioned = {};
  for (const pos of _BAT_POSITIONS) {
    sectioned[pos] = [];
    const cands = _batterCandidatesForPos(pos, 10);
    for (const ap of cands) {
      if (!seen.has(ap.id)) { seen.add(ap.id); sectioned[pos].push(ap); }
    }
  }
  const totalCands = Object.values(sectioned).reduce((s, arr) => s + arr.length, 0);

  lines.push('## 포지션별 보강 후보 (총 ' + totalCands + '명, 포지션마다 proj_ros 5 ∪ 2026 시즌 5)');
  lines.push('');
  lines.push('각 포지션 섹션은 그 포지션 자격 후보. 다중 자격이면 첫 등장 포지션에만 표시 (다른 포지션 자격은 슬롯 옆 표시). 카테고리 임팩트는 같은 "타자 픽업 관점" 기준.');
  lines.push('');
  // 후보 표도 우리 타자 표와 동일한 6 기간(7d/14d/30d/2026/projected/proj_ros)
  // 으로 보여 — Phase 1+2 enrichment 덕에 waiver 후보도 stat 보강됨.
  const periodHdrCells = _BATTER_PERIODS.map(
    pe => pe.label + ' ' + cols.join('/')
  ).join(' | ');
  const periodSep = ['---', '---']
    .concat(_BATTER_PERIODS.map(() => '---'))
    .concat(['---', '---'])
    .join('|');
  for (const pos of _BAT_POSITIONS) {
    const list = sectioned[pos];
    if (!list.length) continue;
    lines.push('### ' + pos + ' (' + list.length + '명)');
    lines.push('');
    lines.push('| 선수 | 팀 | ' + periodHdrCells + ' | 픽업률 | 위험 태그 |');
    lines.push('|' + periodSep + '|');
    for (const ap of list) {
      const periodCells = _BATTER_PERIODS.map(pe => {
        // waiver enrich는 시즌 누적을 'season' 키에 저장하고, 로스터 스크래퍼는
        // '2026' 키에 저장한다. 같은 의미라 키만 다른 데이터를 alias 처리.
        let s = ap.stats[pe.key] || {};
        if (Object.keys(s).length === 0 && pe.key === '2026') {
          s = ap.stats['season'] || {};
        }
        return _batterPeriodCell(pe.key, s);
      });
      const otherPos = (ap.positions || []).filter(p => _BAT_POSITIONS.includes(p) && p !== pos);
      const nameWithDual = ap.name + (otherPos.length ? ' (+' + otherPos.join('/') + ')' : '');
      const risk = _calcRiskTags(ap);
      const riskStr = risk.length ? risk.join('·') : '—';
      const hot = ap.is_hot ? ' 🔥' : '';
      lines.push('| ' + nameWithDual + hot + ' | ' + ap.team + ' | '
        + periodCells.join(' | ') + ' | ' + (ap.add_pct || 0) + '% | ' + riskStr + ' |');
    }
    lines.push('');
  }

  lines.push('## 요청');
  lines.push('');
  lines.push('내 타자 진영 전체를 보고, 어느 포지션 보강이 가장 효율적인지 판단해라.');
  lines.push('- 먼저 "카테고리 우선순위"에서 **공략권(↑) 카테고리**를 확인하고, 그 카테고리에 순증을 주는 스탯 공략을 우선하라.');
  lines.push('- 그 다음 그 스탯에 가장 많이 기여할 포지션·후보 선정.');
  _batterDecisionCore(lines);
  lines.push(_riskTagRuleLine());
  lines.push('- "어디도 보강 불필요(Hold)"가 정답이면 그렇게 답해도 됨');
  lines.push('');
  _appendBatterAnswerFormat(lines, 'all');

  return lines.join('\n');
}

function selectBatterPickup(positionType) {
  _activeId = '_batpickup_' + positionType;
  document.querySelectorAll('.pickup-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('pickup-btn-bat-' + positionType);
  if (btn) btn.classList.add('active');

  const prompt = positionType === 'all'
    ? buildBatterAllPickupPrompt()
    : buildBatterPickupPrompt(positionType);
  _statsBlob = null;

  document.getElementById('placeholder').style.display = 'none';
  const content = document.getElementById('prompt-content');
  content.style.display = 'flex';
  content.style.flexDirection = 'column';
  content.style.flex = '1';
  content.style.overflow = 'hidden';

  const label = positionType === 'all' ? '타자 종합 분석' : positionType + ' 보강 분석';
  document.getElementById('prompt-player').textContent = '📊 ' + label;

  const ta = document.getElementById('prompt-text');
  ta.value = prompt;
  const n = prompt.length;
  const cc = document.getElementById('char-count');
  cc.textContent = n.toLocaleString() + ' 자';
  cc.className = 'char-count' + (n > DATA.char_limit ? ' over' : '');
  const banner = document.getElementById('limit-banner');
  if (n > DATA.char_limit) {
    banner.style.display = 'flex';
    _statsBlob = new Blob([prompt], { type: 'text/plain;charset=utf-8' });
  } else {
    banner.style.display = 'none';
  }
  document.getElementById('copy-feedback').style.display = 'none';
  _scrollPromptIntoView();
}

  } else {
    banner.style.display = 'none';
  }

  document.getElementById('copy-feedback').style.display = 'none';
  _scrollPromptIntoView();

function copyPrompt() {
  const ta = document.getElementById('prompt-text');
  if (!ta.value) return;
  navigator.clipboard.writeText(ta.value).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✅ 복사됨';
    btn.classList.add('copied');
    const fb = document.getElementById('copy-feedback');
    fb.style.display = 'block';
    setTimeout(() => {
      btn.textContent = '📋 복사';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function downloadStats() {
  if (!_statsBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(_statsBlob);
  a.download = 'stats_' + (_activeId || 'player') + '.md';
  a.click();
}

function renderRoster() {
  const panel = document.getElementById('roster-panel');
  panel.innerHTML = '';

  // Pickup section: SP / RP team-level pickup prompt buttons
  const pickupDiv = document.createElement('div');
  pickupDiv.className = 'pickup-section';
  pickupDiv.innerHTML = '<div class="pos-label">📊 투수진 보강 프롬프트</div>';
  for (const t of ['SP', 'RP']) {
    const b = document.createElement('button');
    b.className = 'pickup-btn';
    b.id = 'pickup-btn-' + t;
    b.textContent = t + ' 보강 분석';
    b.onclick = () => selectPitcherPickup(t);
    pickupDiv.appendChild(b);
  }
  // 내일 SP 스트림 비교 — 1일 swap decision (내 SP vs 내일 등판 waiver SP)
  {
    const b = document.createElement('button');
    b.className = 'pickup-btn';
    b.id = 'pickup-btn-SP-stream';
    b.textContent = '내일 SP 스트림 비교';
    b.onclick = () => selectSPStreamCompare();
    pickupDiv.appendChild(b);
  }
  panel.appendChild(pickupDiv);

  // Batter pickup section: 6 positions + 1 종합
  const batPickupDiv = document.createElement('div');
  batPickupDiv.className = 'pickup-section';
  batPickupDiv.innerHTML = '<div class="pos-label">📊 타자 보강 프롬프트</div>';
  for (const t of _BAT_POSITIONS) {
    const b = document.createElement('button');
    b.className = 'pickup-btn';
    b.id = 'pickup-btn-bat-' + t;
    b.textContent = t + ' 보강 분석';
    b.onclick = () => selectBatterPickup(t);
    batPickupDiv.appendChild(b);
  }
  const allBtn = document.createElement('button');
  allBtn.className = 'pickup-btn';
  allBtn.id = 'pickup-btn-bat-all';
  allBtn.textContent = '타자 종합 분석';
  allBtn.onclick = () => selectBatterPickup('all');
  batPickupDiv.appendChild(allBtn);
  panel.appendChild(batPickupDiv);

  // DL(IL) stash section — who to park in an empty IL slot
  const ilDiv = document.createElement('div');
  ilDiv.className = 'pickup-section';
  ilDiv.innerHTML = '<div class="pos-label">🏥 DL 보강 프롬프트</div>';
  for (const [kind, label] of [['pitcher', '투수'], ['batter', '타자']]) {
    const b = document.createElement('button');
    b.className = 'pickup-btn';
    b.id = 'pickup-btn-il-' + kind;
    b.textContent = label + ' 분석';
    b.onclick = () => selectILPrompt(kind);
    ilDiv.appendChild(b);
  }
  panel.appendChild(ilDiv);
}

document.addEventListener('DOMContentLoaded', renderRoster);

</script>
